<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="w0g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#C8E6C9"/></linearGradient>
    <linearGradient id="w1g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E3F2FD"/><stop offset="100%" stop-color="#BBDEFB"/></linearGradient>
    <linearGradient id="w2g" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFF3E0"/><stop offset="100%" stop-color="#FFE0B2"/></linearGradient>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FCE4EC"/><stop offset="100%" stop-color="#F8BBD9"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#78909C"/></marker>
  </defs>

  <!-- Wave 0 -->
  <rect x="10" y="10" width="200" height="80" rx="8" fill="url(#w0g)" stroke="#81C784" stroke-width="1.5"/>
  <text x="110" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">Wave 0 · 打地基</text>
  <text x="110" y="60" text-anchor="middle" font-size="11" fill="#388E3C">建立公共术语、证据来源</text>
  <text x="110" y="77" text-anchor="middle" font-size="11" fill="#388E3C">确认每个主题的起点</text>

  <!-- Arrow -->
  <line x1="210" y1="50" x2="240" y2="50" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wave 1 -->
  <rect x="245" y="10" width="200" height="80" rx="8" fill="url(#w1g)" stroke="#64B5F6" stroke-width="1.5"/>
  <text x="345" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">Wave 1 · 逐题深挖</text>
  <text x="345" y="60" text-anchor="middle" font-size="11" fill="#1976D2">每个主题独立找证据</text>
  <text x="345" y="77" text-anchor="middle" font-size="11" fill="#1976D2">做笔记、写问题清单</text>

  <!-- Arrow -->
  <line x1="445" y1="50" x2="475" y2="50" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Wave 2 -->
  <rect x="480" y="10" width="200" height="80" rx="8" fill="url(#w2g)" stroke="#FFB74D" stroke-width="1.5"/>
  <text x="580" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">Wave 2 · 跨题综合</text>
  <text x="580" y="60" text-anchor="middle" font-size="11" fill="#EF6C00">把各主题的发现串起来</text>
  <text x="580" y="77" text-anchor="middle" font-size="11" fill="#EF6C00">发现矛盾、标注判断可信度</text>

  <!-- Arrow -->
  <line x1="680" y1="50" x2="710" y2="50" stroke="#78909C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HITL2 + Readiness -->
  <rect x="715" y="10" width="175" height="80" rx="8" fill="url(#rg)" stroke="#F06292" stroke-width="1.5"/>
  <text x="802" y="35" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">HITL2 + Readiness</text>
  <text x="802" y="55" text-anchor="middle" font-size="11" fill="#D81B60">你来终审</text>
  <text x="802" y="72" text-anchor="middle" font-size="11" fill="#D81B60">确认后生成最终报告</text>

  <!-- Bottom labels -->
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#9E9E9E">≈ 共享基础</text>
  <text x="345" y="115" text-anchor="middle" font-size="11" fill="#9E9E9E">≈ 分头深挖</text>
  <text x="580" y="115" text-anchor="middle" font-size="11" fill="#9E9E9E">≈ 合在一起看</text>
  <text x="802" y="115" text-anchor="middle" font-size="11" fill="#9E9E9E">≈ 你拍板</text>

  <!-- HITL markers -->
  <rect x="95" y="135" width="30" height="18" rx="4" fill="#FF7043"/>
  <text x="110" y="148" text-anchor="middle" font-size="10" fill="white" font-weight="bold">HITL1</text>
  <text x="110" y="168" text-anchor="middle" font-size="10" fill="#BF360C">开始前：选模式+定问题</text>

  <rect x="790" y="135" width="30" height="18" rx="4" fill="#FF7043"/>
  <text x="805" y="148" text-anchor="middle" font-size="10" fill="white" font-weight="bold">HITL2</text>
  <text x="805" y="168" text-anchor="middle" font-size="10" fill="#BF360C">综合后：审阅+选报告视角</text>
</svg>