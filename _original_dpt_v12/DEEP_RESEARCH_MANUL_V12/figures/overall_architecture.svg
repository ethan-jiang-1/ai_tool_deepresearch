<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 340" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <linearGradient id="tpl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#EDE7F6"/><stop offset="100%" stop-color="#D1C4E9"/></linearGradient>
    <linearGradient id="rb" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#E8EAF6"/><stop offset="100%" stop-color="#C5CAE9"/></linearGradient>
    <linearGradient id="ctrl" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFF8E1"/><stop offset="100%" stop-color="#FFECB3"/></linearGradient>
    <linearGradient id="engine" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#C8E6C9"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.15"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C6BC0"/></marker>
  </defs>

  <!-- Template Package -->
  <rect x="20" y="20" width="220" height="130" rx="10" fill="url(#tpl)" stroke="#7E57C2" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="130" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#4527A0">模板包（Template Package）</text>
  <line x1="40" y1="58" x2="220" y2="58" stroke="#B39DDB" stroke-width="0.8"/>
  <text x="130" y="75" text-anchor="middle" font-size="10" fill="#5E35B1">specs/ 规范定义</text>
  <text x="130" y="90" text-anchor="middle" font-size="10" fill="#5E35B1">output_templates/ 输出骨架</text>
  <text x="130" y="105" text-anchor="middle" font-size="10" fill="#5E35B1">command_playbooks/ 命令剧本</text>
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#5E35B1">flows/ 执行流定义</text>
  <text x="130" y="135" text-anchor="middle" font-size="10" fill="#5E35B1">cli_tools/ 只读检查器</text>

  <!-- Arrow -->
  <line x1="240" y1="85" x2="315" y2="85" stroke="#5C6BC0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="278" y="78" text-anchor="middle" font-size="9" fill="#5C6BC0" font-weight="bold">实例化</text>

  <!-- Run Bundle -->
  <rect x="320" y="20" width="540" height="300" rx="10" fill="url(#rb)" stroke="#5C6BC0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#283593">运行包（Run Bundle） — deepresearch_xxx/</text>

  <!-- 5 Control Files -->
  <rect x="340" y="60" width="500" height="85" rx="8" fill="url(#ctrl)" stroke="#FFB300" stroke-width="1.2"/>
  <text x="590" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#F57F17">五份控制文件 —— 整个运行的"操作系统"</text>

  <rect x="352" y="88" width="88" height="48" rx="5" fill="white" stroke="#FFB300" stroke-width="0.8"/>
  <text x="396" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#E65100">PROFILE</text>
  <text x="396" y="125" text-anchor="middle" font-size="8" fill="#BF360C">你的意图和选择</text>

  <rect x="448" y="88" width="88" height="48" rx="5" fill="white" stroke="#FFB300" stroke-width="0.8"/>
  <text x="492" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565C0">PLAN</text>
  <text x="492" y="125" text-anchor="middle" font-size="8" fill="#0D47A1">研究蓝图和关卡</text>

  <rect x="544" y="88" width="88" height="48" rx="5" fill="white" stroke="#FFB300" stroke-width="0.8"/>
  <text x="588" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E7D32">STATUS</text>
  <text x="588" y="125" text-anchor="middle" font-size="8" fill="#1B5E20">当前状态和缺口</text>

  <rect x="640" y="88" width="88" height="48" rx="5" fill="white" stroke="#FFB300" stroke-width="0.8"/>
  <text x="684" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#6A1B9A">QUEUE</text>
  <text x="684" y="125" text-anchor="middle" font-size="8" fill="#4A148C">下一步做什么</text>

  <rect x="736" y="88" width="88" height="48" rx="5" fill="white" stroke="#FFB300" stroke-width="0.8"/>
  <text x="780" y="108" text-anchor="middle" font-size="9" font-weight="bold" fill="#C62828">TRACE</text>
  <text x="780" y="125" text-anchor="middle" font-size="8" fill="#B71C1C">诊断日志</text>

  <!-- Run directories -->
  <rect x="340" y="158" width="245" height="72" rx="6" fill="white" stroke="#7986CB" stroke-width="0.8"/>
  <text x="462" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#283593">seed_topics/</text>
  <text x="462" y="194" text-anchor="middle" font-size="9" fill="#3F51B5">_reference/ 所有证据文件</text>
  <text x="462" y="210" text-anchor="middle" font-size="9" fill="#3F51B5">_artifacts/ 分析产物和综合报告</text>

  <rect x="595" y="158" width="245" height="72" rx="6" fill="white" stroke="#7986CB" stroke-width="0.8"/>
  <text x="717" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#283593">_framework/</text>
  <text x="717" y="194" text-anchor="middle" font-size="9" fill="#3F51B5">只读：本地规范快照</text>
  <text x="717" y="210" text-anchor="middle" font-size="9" fill="#3F51B5">_cache/ 搜索缓存区</text>

  <!-- Agent Engine -->
  <rect x="340" y="245" width="500" height="60" rx="8" fill="url(#engine)" stroke="#66BB6A" stroke-width="1.2"/>
  <text x="590" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Agent 执行引擎</text>
  <text x="590" y="286" text-anchor="middle" font-size="10" fill="#388E3C">读五份控制文件 → 执行 QUEUE 任务 → 写本地文件 → 同步 STATUS → 循环</text>

  <!-- Final output -->
  <rect x="715" y="310" width="130" height="28" rx="5" fill="#81C784" stroke="#43A047" stroke-width="1"/>
  <text x="780" y="329" text-anchor="middle" font-size="10" font-weight="bold" fill="white">final/ 最终报告</text>
</svg>