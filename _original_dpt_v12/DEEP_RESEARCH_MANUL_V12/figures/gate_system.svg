<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
  <defs>
    <marker id="gArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546E7A"/></marker>
  </defs>

  <!-- Gates as a row of boxes -->
  <rect x="0" y="25" width="85" height="50" rx="6" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1.2"/>
  <text x="42" y="46" text-anchor="middle" font-size="9" font-weight="bold" fill="#37474F">实例化完成</text>
  <text x="42" y="62" text-anchor="middle" font-size="7" fill="#607D8B">文件骨架 OK</text>

  <line x1="85" y1="50" x2="102" y2="50" stroke="#546E7A" stroke-width="2" marker-end="url(#gArrow)"/>

  <rect x="105" y="25" width="85" height="50" rx="6" fill="#CFD8DC" stroke="#90A4AE" stroke-width="1.2"/>
  <text x="147" y="46" text-anchor="middle" font-size="9" font-weight="bold" fill="#37474F">环境就绪</text>
  <text x="147" y="62" text-anchor="middle" font-size="7" fill="#607D8B">种子主题到位</text>

  <line x1="190" y1="50" x2="207" y2="50" stroke="#546E7A" stroke-width="2" marker-end="url(#gArrow)"/>

  <rect x="210" y="20" width="95" height="60" rx="6" fill="#E8F5E9" stroke="#66BB6A" stroke-width="1.8"/>
  <text x="257" y="42" text-anchor="middle" font-size="9" font-weight="bold" fill="#2E7D32">Wave 0 完成</text>
  <text x="257" y="56" text-anchor="middle" font-size="7" fill="#43A047">共享证据达标</text>
  <text x="257" y="70" text-anchor="middle" font-size="7" fill="#43A047">起点可启动</text>

  <line x1="305" y1="50" x2="322" y2="50" stroke="#546E7A" stroke-width="2" marker-end="url(#gArrow)"/>

  <rect x="325" y="20" width="95" height="60" rx="6" fill="#E3F2FD" stroke="#42A5F5" stroke-width="1.8"/>
  <text x="372" y="42" text-anchor="middle" font-size="9" font-weight="bold" fill="#1565C0">Wave 1 完成</text>
  <text x="372" y="56" text-anchor="middle" font-size="7" fill="#1E88E5">每主题证据达标</text>
  <text x="372" y="70" text-anchor="middle" font-size="7" fill="#1E88E5">分析产物齐全</text>

  <line x1="420" y1="50" x2="437" y2="50" stroke="#546E7A" stroke-width="2" marker-end="url(#gArrow)"/>

  <rect x="440" y="20" width="95" height="60" rx="6" fill="#FFF3E0" stroke="#FFA726" stroke-width="1.8"/>
  <text x="487" y="42" text-anchor="middle" font-size="9" font-weight="bold" fill="#E65100">Wave 2 完成</text>
  <text x="487" y="56" text-anchor="middle" font-size="7" fill="#EF6C00">跨题综合通过</text>
  <text x="487" y="70" text-anchor="middle" font-size="7" fill="#EF6C00">HITL2 可启动</text>

  <line x1="535" y1="50" x2="562" y2="50" stroke="#546E7A" stroke-width="2"/>

  <!-- HITL2 -->
  <rect x="565" y="18" width="80" height="64" rx="6" fill="#FF7043" stroke="#E64A19" stroke-width="2"/>
  <text x="605" y="40" text-anchor="middle" font-size="10" font-weight="bold" fill="white">HITL2</text>
  <text x="605" y="56" text-anchor="middle" font-size="8" fill="white">你来拍板</text>
  <text x="605" y="72" text-anchor="middle" font-size="7" fill="#FFCCBC">选报告视角</text>

  <line x1="645" y1="50" x2="672" y2="50" stroke="#546E7A" stroke-width="2" marker-end="url(#gArrow)"/>

  <rect x="675" y="25" width="110" height="50" rx="6" fill="#FCE4EC" stroke="#EC407A" stroke-width="1.8"/>
  <text x="730" y="46" text-anchor="middle" font-size="9" font-weight="bold" fill="#C62828">Readiness 通过</text>
  <text x="730" y="62" text-anchor="middle" font-size="7" fill="#D81B60">交付前最终检查</text>
</svg>