<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 656" width="1040" height="656" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" role="img" aria-label="workflow 拓扑：manifest、transition chain、nodes 三层">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1040" height="620" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">workflow 的骨架：一张顺序表 + 一张路由表 + 一堆说明书</text>
  <text x="520" y="58" text-anchor="middle" font-size="13" fill="#64748b">整个框架没有隐藏状态机代码；流程本身就是这三份可读文件</text>

  <!-- manifest row -->
  <rect x="30" y="82" width="980" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="106" font-size="14" font-weight="700" fill="#0f172a">一、manifest.json —— 生命周期顺序（唯一的拓扑权威）</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="48" y="122" width="82" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="89" y="139" fill="#1e3a8a" font-weight="700">instantiation</text>
    <text x="89" y="155" fill="#64748b" font-size="10.5">gate≠null</text>

    <rect x="138" y="122" width="70" height="40" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="173" y="139" fill="#92400e" font-weight="700">hitl1</text>
    <text x="173" y="155" fill="#b45309" font-size="10.5">stop:yes</text>

    <rect x="216" y="122" width="60" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="246" y="145" fill="#1e3a8a">setup</text>

    <rect x="284" y="122" width="86" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="327" y="145" fill="#1e3a8a">seed-topics</text>

    <rect x="378" y="122" width="60" height="40" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="408" y="145" fill="#5b21b6">wave0</text>

    <rect x="446" y="122" width="60" height="40" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="476" y="145" fill="#5b21b6">wave1</text>

    <rect x="514" y="122" width="60" height="40" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="544" y="145" fill="#5b21b6">wave2</text>

    <rect x="582" y="122" width="70" height="40" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="617" y="139" fill="#92400e" font-weight="700">hitl2</text>
    <text x="617" y="155" fill="#b45309" font-size="10.5">stop:yes</text>

    <rect x="660" y="122" width="80" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="700" y="145" fill="#1e3a8a">readiness</text>

    <rect x="748" y="122" width="62" height="40" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="779" y="145" fill="#9a3412">rerun</text>

    <rect x="818" y="122" width="60" height="40" rx="8" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="848" y="139" fill="#9d174d" font-weight="700">final</text>
    <text x="848" y="155" fill="#be185d" font-size="10.5">gate:null</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a3)">
    <line x1="130" y1="142" x2="136" y2="142"/>
    <line x1="208" y1="142" x2="214" y2="142"/>
    <line x1="276" y1="142" x2="282" y2="142"/>
    <line x1="370" y1="142" x2="376" y2="142"/>
    <line x1="438" y1="142" x2="444" y2="142"/>
    <line x1="506" y1="142" x2="512" y2="142"/>
    <line x1="574" y1="142" x2="580" y2="142"/>
    <line x1="652" y1="142" x2="658" y2="142"/>
    <line x1="740" y1="142" x2="746" y2="142"/>
    <line x1="810" y1="142" x2="816" y2="142"/>
  </g>

  <text x="48" y="190" font-size="12" fill="#475569">每个 phase 声明自己的 <tspan font-family="monospace" fill="#0f172a">gate</tspan>（要过哪道关）与 <tspan font-family="monospace" fill="#0f172a">stop</tspan>（要不要等人）：</text>
  <text x="48" y="212" font-size="12" fill="#dc2626">11 个节点里只有两个 <tspan font-family="monospace">stop: yes</tspan>（HITL1 / HITL2）和一个终结节点 final；其余全部 stop: no，自己往下走。</text>

  <!-- chain row -->
  <rect x="30" y="246" width="476" height="206" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="270" font-size="14" font-weight="700" fill="#0f172a">二、transitions.chain.json —— 路由表</text>
  <text x="48" y="292" font-size="11.5" fill="#475569">故意写得很稀疏：只编码确定性的分支。</text>

  <rect x="48" y="304" width="440" height="108" rx="8" fill="#0f172a"/>
  <g font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="11">
    <text x="62" y="324" fill="#7dd3fc">"phases/phase-hitl2.md"</text>
    <text x="62" y="343" fill="#e2e8f0">  : { "passed" : <tspan fill="#86efac">"phases/phase-readiness.md"</tspan>,</text>
    <text x="62" y="362" fill="#e2e8f0">      "rerun"  : <tspan fill="#fca5a5">"phases/phase-rerun.md"</tspan> }</text>
    <text x="62" y="386" fill="#94a3b8">// 其他分支（failed / 未知 state / 未列出的 node）</text>
    <text x="62" y="403" fill="#94a3b8">// look-up 返回 found:false → 归 Agent 判断</text>
  </g>

  <text x="48" y="436" font-size="11.5" fill="#475569">链是"静态映射表"，不是代码：查表 = 确定性路由；</text>
  <text x="48" y="452" font-size="11.5" fill="#475569">查不到 = 明确交回给 Agent 的语义判断。</text>

  <!-- nodes row -->
  <rect x="524" y="246" width="486" height="206" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="542" y="270" font-size="14" font-weight="700" fill="#0f172a">三、nodes/ —— Agent 说明书的三层分工</text>

  <rect x="542" y="284" width="146" height="126" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="615" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">phases/</text>
  <text x="615" y="328" text-anchor="middle" font-size="11.5" fill="#1e3a8a">管「做」</text>
  <text x="556" y="352" font-size="11" fill="#1e40af">何时做、做什么、</text>
  <text x="556" y="370" font-size="11" fill="#1e40af">跑哪条命令、</text>
  <text x="556" y="388" font-size="11" fill="#1e40af">过了怎么走</text>

  <rect x="696" y="284" width="146" height="126" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="769" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">shared/</text>
  <text x="769" y="328" text-anchor="middle" font-size="11.5" fill="#064e3b">管「规矩」</text>
  <text x="710" y="352" font-size="11" fill="#065f46">静默执行、反作弊、</text>
  <text x="710" y="370" font-size="11" fill="#065f46">Gate 规则摘要、</text>
  <text x="710" y="388" font-size="11" fill="#065f46">派工协议</text>

  <rect x="850" y="284" width="142" height="126" rx="10" fill="#fefce8" stroke="#fde68a"/>
  <text x="921" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#a16207">brief/</text>
  <text x="921" y="328" text-anchor="middle" font-size="11.5" fill="#713f12">管「说」</text>
  <text x="864" y="352" font-size="11" fill="#854d0e">给用户看的原文，</text>
  <text x="864" y="370" font-size="11" fill="#854d0e">照念不改字</text>

  <!-- bottom -->
  <rect x="30" y="482" width="980" height="72" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <text x="48" y="508" font-size="13.5" font-weight="700" fill="#b91c1c">关键区分：这些 Markdown 不是可执行代码</text>
  <text x="48" y="531" font-size="12" fill="#991b1b">它们是写给 Agent 读的指令。真正的 Go / No-Go 判定由 gate CLI 依据 definition JSON 强制执行——文档里写"已通过"完全不作数。</text>

  <rect x="30" y="570" width="980" height="70" rx="14" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="48" y="596" font-size="13.5" font-weight="700" fill="#0369a1">为什么这样分？</text>
  <text x="48" y="619" font-size="12" fill="#075985">顺序、路由、判定这些"不能让模型自由发挥"的部分全部搬进 JSON / 代码；只有真正需要语义判断的部分才留在 Markdown 和 Agent 手里。</text>
</svg>
