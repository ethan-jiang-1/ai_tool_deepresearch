<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" width="1040" height="590" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" role="img" aria-label="文档地图：第一层介绍版讲原理，往下分使用者和技术两个方向">
  <defs>
    <marker id="rm1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1040" height="590" fill="#ffffff"/>

  <text x="520" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">这份解读分三层：先懂原理，再按需深入</text>
  <text x="520" y="58" text-anchor="middle" font-size="13" fill="#64748b">越往上越浅、越往下越细。不感兴趣的层可以完全不看</text>

  <!-- layer 1 -->
  <rect x="30" y="84" width="980" height="126" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="52" y="112" font-size="16" font-weight="700" fill="#1d4ed8">第一层 · 介绍版</text>
  <text x="52" y="136" font-size="12.5" fill="#1e3a8a">它是干什么的、用起来什么样、为什么必须这么设计 —— 只讲道理，不碰技术细节</text>
  <rect x="52" y="150" width="936" height="40" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="70" y="167" font-size="12" fill="#1e3a8a"><tspan font-weight="700">01 · 它是干什么的</tspan>　开口一句话说清它做什么，再讲整个用起来的体验</text>
  <text x="70" y="183" font-size="11.5" fill="#3b82f6">然后才是"为什么要这么设计"：黑盒的四个毛病、三条基本约定、代价与边界</text>

  <!-- arrows down -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#rm1)">
    <line x1="300" y1="214" x2="300" y2="244"/>
    <line x1="740" y1="214" x2="740" y2="244"/>
  </g>

  <!-- layer 2 left: user -->
  <rect x="30" y="252" width="460" height="298" rx="14" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="260" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">第二层 · 给使用者</text>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#7c3aed">明白"背后有些什么"就好 · 不需要技术背景</text>

  <g font-size="11.5" fill="#4c1d95">
    <rect x="52" y="320" width="416" height="30" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="68" y="340"><tspan font-weight="700">01 · 开头那次对话</tspan>　它先回来找你，你点头或改</text>

    <rect x="52" y="356" width="416" height="30" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="68" y="376"><tspan font-weight="700">02 · 中间那几天</tspan>　它为什么不找你（本篇是重点）</text>

    <rect x="52" y="392" width="416" height="30" rx="7" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="68" y="412"><tspan font-weight="700">03 · 拿到报告之后</tspan>　该你判断了</text>
  </g>

  <rect x="52" y="438" width="416" height="96" rx="10" fill="#ede9fe"/>
  <text x="68" y="458" font-size="12" font-weight="700" fill="#5b21b6">三篇按时间顺序，跟着一次研究走一遍</text>
  <text x="68" y="478" font-size="11.5" fill="#6d28d9">中间那几天背后撑着的是四件事：</text>
  <text x="68" y="497" font-size="11.5" fill="#7c3aed">项目文件夹 · 干活的工人 · 关卡 · 一本账</text>
  <text x="68" y="518" font-size="11" fill="#8b5cf6">"记不上账的东西，不算数" —— 记住这句就够了</text>

  <!-- layer 2 right: tech -->
  <rect x="520" y="252" width="490" height="298" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="765" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">第三层 · 给技术读者</text>
  <text x="765" y="306" text-anchor="middle" font-size="12" fill="#10b981">明白背后的技术原理 · 术语和代码名都在这里</text>

  <g font-size="11" fill="#065f46">
    <rect x="542" y="320" width="446" height="26" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="558" y="338"><tspan font-weight="700">01 · 骨架</tspan>　文件怎么分、状态放哪、阶段怎么交接</text>

    <rect x="542" y="352" width="446" height="26" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="558" y="370"><tspan font-weight="700">02 · 完整流程</tspan>　十一个阶段挨个走一遍</text>

    <rect x="542" y="384" width="446" height="26" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="558" y="402"><tspan font-weight="700">03 · 结论凭什么可信</tspan>　证据链、检查程序、防作弊</text>

    <rect x="542" y="416" width="446" height="26" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="558" y="434"><tspan font-weight="700">04 · 怎么跑好几天不用管</tspan>　静默、换招、断线恢复</text>

    <rect x="542" y="448" width="446" height="26" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="558" y="466"><tspan font-weight="700">05 · 多任务并发怎么不乱</tspan>　派活、记账、出错处理</text>

    <rect x="542" y="480" width="446" height="54" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="558" y="499"><tspan font-weight="700">06 · 术语与速查</tspan>　名词对照 + 全部命令</text>
    <text x="558" y="518" font-size="10.5" fill="#047857">含「十个可以照搬的原则」—— 想自己搭一套的看这里</text>
    <text x="558" y="530" font-size="10" fill="#10b981">（这一层可以直接从 01、02 顺着读）</text>
  </g>

  <text x="520" y="576" text-anchor="middle" font-size="11.5" fill="#64748b">每一层的 README 只是目录页；正文都在上面列出的独立文件里</text>
</svg>
