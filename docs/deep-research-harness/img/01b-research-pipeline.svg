<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif" role="img" aria-label="深度研究的真实结构是一条证据到判断的流水线">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1000" height="250" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">深度研究的真实结构：一条「证据 → 判断」的流水线</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="20" y="64" width="118" height="72" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="79" y="90" font-weight="700" fill="#92400e" font-size="12.5">人的问题</text>
    <text x="79" y="110" fill="#b45309">目标 / 用途</text>
    <text x="79" y="126" fill="#b45309">/ 边界</text>

    <rect x="158" y="64" width="118" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="217" y="90" font-weight="700" fill="#5b21b6" font-size="12.5">拆成话题</text>
    <text x="217" y="110" fill="#6d28d9">几个彼此</text>
    <text x="217" y="126" fill="#6d28d9">独立的问题</text>

    <rect x="296" y="64" width="118" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="355" y="90" font-weight="700" fill="#5b21b6" font-size="12.5">收集来源</text>
    <text x="355" y="110" fill="#6d28d9">每个话题</text>
    <text x="355" y="126" fill="#6d28d9">有哪些材料</text>

    <rect x="434" y="64" width="132" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="500" y="88" font-weight="700" fill="#5b21b6" font-size="12.5">读原文抽结论</text>
    <text x="500" y="108" fill="#6d28d9">哪个来源的</text>
    <text x="500" y="124" fill="#6d28d9">哪一句支撑哪条</text>

    <rect x="586" y="64" width="118" height="72" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="645" y="90" font-weight="700" fill="#5b21b6" font-size="12.5">跨话题综合</text>
    <text x="645" y="110" fill="#6d28d9">对上，并标出</text>
    <text x="645" y="126" fill="#6d28d9">还缺什么</text>

    <rect x="724" y="64" width="118" height="72" rx="10" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="783" y="90" font-weight="700" fill="#9d174d" font-size="12.5">组织成报告</text>
    <text x="783" y="110" fill="#be185d">给人读的</text>
    <text x="783" y="126" fill="#be185d">阅读路径</text>

    <rect x="862" y="64" width="118" height="72" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="921" y="88" font-weight="700" fill="#047857" font-size="12.5">可倒推验证</text>
    <text x="921" y="108" fill="#065f46">每条结论</text>
    <text x="921" y="126" fill="#065f46">→ 具体来源</text>
  </g>

  <g stroke="#7c3aed" stroke-width="1.8" marker-end="url(#p1)">
    <line x1="140" y1="100" x2="154" y2="100"/>
    <line x1="278" y1="100" x2="292" y2="100"/>
    <line x1="416" y1="100" x2="430" y2="100"/>
    <line x1="568" y1="100" x2="582" y2="100"/>
    <line x1="706" y1="100" x2="720" y2="100"/>
    <line x1="844" y1="100" x2="858" y2="100"/>
  </g>

  <rect x="20" y="158" width="960" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="184" font-size="12.5" font-weight="700" fill="#0f172a">Harness 做的事，就是把这条流水线显式地写下来：</text>
  <text x="40" y="206" font-size="12" fill="#475569">把中间每一步变成<tspan font-weight="700" fill="#0f172a">独立的阶段节点</tspan>，每一步的产物<tspan font-weight="700" fill="#0f172a">落到磁盘</tspan>，每一步的完成<tspan font-weight="700" fill="#0f172a">由机器验收</tspan>。</text>
  <text x="40" y="224" font-size="12" fill="#64748b">于是"研究"从一段越来越长的对话，变成一串带验收条件的、可中断可重来的离散步骤。</text>
</svg>
