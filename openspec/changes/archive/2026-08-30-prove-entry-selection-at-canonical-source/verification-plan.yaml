schema_version: verification-routing/v1
change: prove-entry-selection-at-canonical-source
test_classes:
  unit:
    status: not_applicable
    rationale: >-
      No isolated in-process JavaScript contract is added; the change rewrites
      Agent-facing entry pointers and the documentation regressions that lock
      canonical completeness versus pointer non-restatement.
  integration:
    status: selected
    rationale: >-
      RUE-006 proof shape, ACR Routing-as-pointer, and the three retargeted
      entry-selection contracts are cross-file deterministic Markdown
      contracts under tests/integration/.
  deterministic_e2e:
    status: not_applicable
    rationale: >-
      No Gate, queue, work-unit, or lifecycle chain is executed.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      The change does not claim real Agent behavior; ACR-004 forbids inferring
      that an Agent actually followed the pointer.
claims:
  - id: canonical-entry-selection-complete
    statement: >-
      RUE-006: continue-run-bundle.md Entry Selection (canonical) still states
      both branches, the unsupported-current-entry-contract stop, scan/bare
      non-selection, current-run-bundle-root resolution, and the pre-entry
      research-surface prohibition.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/continue-run-bundle-contract.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: pointer-surfaces-do-not-restate
