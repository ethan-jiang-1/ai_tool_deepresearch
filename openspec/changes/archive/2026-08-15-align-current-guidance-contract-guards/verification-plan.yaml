schema_version: verification-routing/v1
change: align-current-guidance-contract-guards
test_classes:
  unit:
    status: selected
    rationale: >-
      The focused in-process work-ID fixture needs a complete current envelope
      fixture while retaining its parser and binding proof boundary.
  integration:
    status: selected
    rationale: >-
      Existing integration tests directly read current Markdown contracts or
      create test-owned disposable envelopes through the production Engine.
  deterministic_e2e:
    status: not_applicable
    rationale: No lifecycle-scale behavior, transition, or temporary-bundle workflow changes.
  agent_flow_e2e:
    status: not_applicable
    rationale: The change makes no claim about real Agent or sub-agent semantic behavior.
claims:
  - id: work-id-fixture-uses-current-envelope-profile
    statement: >-
      The focused work-ID binding fixture supplies current Wave0 assignment and
      delegated actor facts, so it proves the existing in-process ID binding
      without a legacy envelope fallback.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/work-unit-index.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: current-entry-routing-guards-align
    statement: >-
      Root/Harness guidance tests protect the current selected-pair entry and
      no-fallback contract, rather than retired routing phrases.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/dpt-research-entry-routing-contract.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
