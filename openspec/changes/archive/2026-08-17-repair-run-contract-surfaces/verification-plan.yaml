schema_version: verification-routing/v1
change: 2026-08-17-repair-run-contract-surfaces
test_classes:
  unit:
    status: not_applicable
    rationale: >-
      The change alters no schema, enum, resolver, or verdict logic; unit truth
      tables for Engine contracts are untouched and already green.
  integration:
    status: selected
    rationale: >-
      All new and modified proofs run deterministic CLI fixtures on disposable
      bundles or static doc-lock assertions against framework surfaces — the
      change's observable contract is the public command and document surface.
  deterministic_e2e:
    status: not_applicable
    rationale: >-
      No multi-phase chain behavior changes; the WNC-010 handoff-sequence
      correction is a doc/test-surface alignment whose machine behavior is
      already locked by existing gate-chain integration coverage.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      The change makes no claim about Agent research, judgment, writing, or
      tool behavior; it only aligns Agent-facing contract surfaces with
      already-accepted deterministic contracts.
claims:
  - id: claim-stdout-is-parseable-json
    statement: >-
      SUD-008: `operate-work-unit claim` stdout parses as a single JSON value
      for both wave0 delegated and wave1 phase_agent_fallback claims on an
      eligible disposable bundle, and the parsed object carries
      claimed_work_ids[] and prompt_refs[] coordinates.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/work-unit-claim-stdout-json.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: wnc010-exception-does-not-exempt-enter-phase
    statement: >-
      WNC-010: phase-instantiation.md §6 and phase-hitl1.md §6 carry the
      corrected bootstrap-exception wording — the exception covers
      advance-status source-gate sync only, and both sections instruct the
      exact `enter-phase --node <check.next>` loader command.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
