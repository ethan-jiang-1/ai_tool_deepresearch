schema_version: verification-routing/v1
change: harness-review-defect-sync
test_classes:
  unit:
    status: selected
    rationale: 引擎 helper 级契约（共享 parser、retire helper 语义、backing 断言、rwg 文本锁、vocabulary gate）可直接以 node:test 单测证明。
  integration:
    status: selected
    rationale: CLI 层行为（retire 参数面与零突变 blocked、audit tamper、exit code 约定、playbook doc-lock、wave1 gate 回归）需要真实 CLI 进程与临时 bundle。
  deterministic_e2e:
    status: selected
    rationale: writer/auditor 共享解析器需经 gate CLI 链路在临时 bundle 上端到端验证一次。
  agent_flow_e2e:
    status: not_applicable
    rationale: 本 change 全部为确定性引擎/文档缺陷修复，无 agent 行为面需要真实 agent runtime 证据。
