schema_version: verification-routing/v1
change: rebuild-hitl1-research-access-envelope
test_classes:
  unit:
    status: selected
    rationale: >-
      Envelope shape validation, the two classification axes, owner-to-repair-kind
      derivation, and the explicitly-unclassified conclusion are pure
      deterministic facts with focused positive and negative truth tables.
  integration:
    status: selected
    rationale: >-
      The regression must prove the HITL1 Gate consumer agrees with the resolver
      across admission, adapter-owned feedback projection, the Agent-owned
      probe_relay route, and legacy free-text observations.
  deterministic_e2e:
    status: selected
    rationale: >-
      Fixture-backed temporary bundles exercise the existing HITL1 Gate with
      partial and zero reachability plus retained HITL1 choices. This proves the
      deterministic Gate boundary and its side effects; it does not execute the
      Phase Agent or probe, nor claim real provider reachability or Agent behavior.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      This change modifies deterministic Engine contracts and Agent-facing static
      guidance only. It makes no claim about real provider reachability or Subject
      Agent research behavior; accepted research-access-adapter guidance already
      states fixtures cannot prove provider availability.
claims:
  - id: envelope-shape-statically-bounded
    statement: >-
      ProfileSchema accepts a statically bounded access envelope carrying at most one
      closed enumerated result per declared source class, enforces the paired
      available/class-scoped and unavailable/universal access-boundary rules, and rejects a matrix-shaped
      observation that grows with attempts (query text or history, candidate URL
      list, retry list, or HTTP status matrix), while legacy observations without
      an envelope remain schema-readable.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/schema/contracts/profile.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: two-axis-classification-and-repair-derivation
    statement: >-
      The resolver maps each unavailable access-boundary location (host_surface, host_policy,
      network_path, probe_relay) to exactly one owner and derives its repair kind
      from that owner, so probe_relay yields agent_action while the three external
      roots yield external_action; an observation establishing no routeable owner resolves to an explicit
      unclassified conclusion rather than being normalized into any root. No
      classification is derived from prose position or prefix.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/host_tools/research-access-adapter.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: gate-admission-and-feedback-projection
    statement: >-
      The HITL1 Gate admits when at least one declared source class returned real
      requested page content, blocks when none did, and projects one direct
      owner-specific finding per root: the three external roots name the selected
      adapter contract and its owning boundary, probe_relay routes to the Agent as
      agent_action, and an unclassified observation surfaces that fact explicitly
      instead of degrading to a generic retry message.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/check-gate-hitl1-recorded.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: adapter-contract-declaration-integrity
    statement: >-
      The selected adapter contract retains only its declared identity, launcher
      routing, permission mode, and operation surfaces; it contains no source-class,
      query, taxonomy, or return-map controller content. Its retained bindings stay
      deterministic while the independent controller owns the sub-agent guidance.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/hitl1-research-access-adapter.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: static-guidance-branch-coverage
    statement: >-
      The static HITL1 guidance requires the same classification vocabulary on
      every unavailable branch, including the positive-candidate fetch-side branch
      that previously required only a free-text reason. The isolated probe receives
      an independent actor-delivered access-envelope controller whose declared source
      classes and axes match the closed schema enums and its three initial neutral queries
      are exact; the adapter contract, Phase body, and general probe guide do not duplicate
      its control content. The static guidance
      carries the exact partial-reachability disclosure rendered only alongside the
      available result when the recorded observation reports unreachable classes,
      prohibits persistence of probe material to research-evidence surfaces, and does
      not add a second HITL decision point.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/phase-hitl1-research-access.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: partial-reachability-admission-loop
    statement: >-
      The existing HITL1 Gate evaluates a fixture-backed temporary bundle whose
      recorded envelope has reachable and unreachable classes as passing without
      clearing that classification, evaluates one with no reachable class as
      blocked while retaining HITL1 choices, and does not itself add fixture
      probe material to reference, cache, artifacts, receipts, ledger, or
      coverage floors. This does not claim that a Phase Agent or probe ran.
    test_class: deterministic_e2e
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/e2e/hitl1-research-access-adapter.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
