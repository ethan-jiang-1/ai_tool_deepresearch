schema_version: semantic-closure/v1
change: dwu-capability-identity-split
status: not_applicable
reason: >-
  本 change 是 capability 身份迁移：把 agent/delegated-work-units 中已归属明确的
  23 个 requirement 逐字节搬移至三个新 capability（submission/preflight/correction），
  另 2 个母体保留块补注册内联 ID。全部为文本搬移与 ID/注册表重织，不改变任何
  requirement 的语义内容，不改变任何 engine 模块的确定性判定逻辑，不新增或改变
  verdict consumer、runtime state、projection、status 或 reader-facing view。
  catalog（openspec/governance/semantic-fact-families.yaml）中相关 family
  （如 work-unit.submission-ledger-and-supersession、work-unit.transaction-mutation-integrity）
  的 bounded_question 与 verdict 归属在迁移前后保持不变——同一语义结论仍由同一
  engine 模块产出、被同一 surface 消费，只是 spec 文本换了 capability 载体，
  故无 affected family。
