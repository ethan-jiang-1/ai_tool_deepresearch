schema_version: verification-routing/v1
change: 2026-08-31-repair-residual-spec-drift
test_classes:
  unit:
    status: selected
    rationale: >-
      本 change 全部可证明事实均为 in-process 确定性文本断言：涉改 requirement
      块内旧句不再出现（`semantic_boundary` gate-hint 误列、5 值恢复词汇枚举、
      binding-identity autofill / nonce normalization 授权句）、新锚点句存在
      （disposition 五值列举、导出指针、drained 并存句、`wave0_source_intake`
      判别键、retention 注记、Purpose 修正、catalog/guidance 修正）。均由
      node:test 断言锁定，无跨进程行为。
  integration:
    status: not_applicable
    rationale: >-
      无 CLI、无跨文件工作流执行面变化；governance checker（content-drift、
      spec-req-ids、project-reqs、capability-taxonomy）由 `npm run
      governance:check` 作为既有治理面直接覆盖。
  deterministic_e2e:
    status: not_applicable
    rationale: >-
      零 lifecycle/gate/recovery 行为变化，不驱动端到端 bundle 链。
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      不声称任何真实 Agent 行为变化；纯 accepted spec 文本重同步。
