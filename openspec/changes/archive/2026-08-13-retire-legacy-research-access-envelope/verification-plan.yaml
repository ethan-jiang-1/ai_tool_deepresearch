  - id: current-hitl1-direct-sample-e2e
    statement: A fresh temporary bundle can record either complete current direct-sample outcome and proceed through the production HITL1 Gate without legacy access data.
    test_class: deterministic_e2e
    proof_subject: deterministic_contract
