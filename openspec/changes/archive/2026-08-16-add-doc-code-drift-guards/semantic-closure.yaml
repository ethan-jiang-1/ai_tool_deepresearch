reason: >-
  This change adds governance tooling only: a deterministic content-drift
  checker (prose path / CLI name / gate-summary coverage), a --check-prefix
  query interface on check-project-reqs.mjs, a static extension of the
  exit-code inventory regression, and finalizer wiring. None of these alter
  any deterministic runtime fact, schema, state, projection, or executable
  contract; the affected fact families cataloged in
  openspec/governance/semantic-fact-families.yaml remain unchanged by this
