      trace-bound deterministic check that the returned Queue terminalizes the
      original demand with terminal_no_successor, creates no Queue-owned repair
      descendant, and promotes only the pre-existing next demand.
    test_class: agent_flow_e2e
    proof_subject: deterministic_contract
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_agentic-queue/case-43-standard-failure-repair.md
