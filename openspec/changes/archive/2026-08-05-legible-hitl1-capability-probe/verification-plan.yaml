      same-Gate path, renders the corresponding direct result after the observation and
      before the Gate, and exposes the silent exit only after Gate pass. The exact-text
      brief makes no host-output suppression promise. This claim proves only the
      deterministic Markdown contract, not host rendering or real-Agent behavior.
    test_class: integration
    proof_subject: deterministic_contract
