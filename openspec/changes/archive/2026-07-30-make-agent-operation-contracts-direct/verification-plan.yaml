schema_version: verification-routing/v1
change: make-agent-operation-contracts-direct
test_classes:
  unit:
    status: selected
    rationale: >-
      Direct operation projections are narrow deterministic helpers: static invocation parsing, Zod-derived authoring shape, safe error mapping, cue/action-core extraction, existing claim/timeout branch presentation, omission batching, and release-version alignment all require focused contract tests.
  integration:
    status: selected
    rationale: >-
      Selected public CLIs must prove help and invocation short-circuiting, preservation of existing domain behavior, temporary-bundle side-effect boundaries, and Markdown/CLI ownership loops through production entrypoints.
  deterministic_e2e:
    status: not_applicable
    rationale: >-
      C3 changes local operation presentation and feedback while preserving the existing transition table, Gate authority, and lifecycle semantics; focused production CLI integrations cover its bounded entry and status edges without asserting a workflow-scale state-chain change.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      C3 improves what an executing Agent can read but does not claim that a real Agent follows it, performs research, repairs a bundle, or has host liveness; a fixture or static presentation check cannot prove those behaviors.
claims:
  - id: selected-cli-static-invocation-contract
    statement: >-
      CLE-001 and CLE-003: selected public operation helpers distinguish side-effect-free help from bounded code-2 invocation/configuration feedback without becoming a generic command controller.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/cli-operation-contract.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: topic-state-schema-and-safe-validation-projection
    statement: >-
      CTS-004: supported TopicApplyPlanSchema forms, including effect-wrapped structural branches, produce context-discriminated templates that the actual top-level schema parses; bounded validation errors retain Zod as the only validator and redact arbitrary retained input values.
