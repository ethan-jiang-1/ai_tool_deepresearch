    status: selected
    rationale: >-
      A narrow helper option changes fixture setup behavior and needs a JS-led
      default-versus-opt-out regression test without claiming a Playbook-Agent
      or Subject-Agent execution.
  integration:
    status: selected
    rationale: >-
      A JS-led Markdown contract test can lock the required Wave0 composition
      and ownership boundary without treating source text as real Agent proof.
  deterministic_e2e:
    status: not_applicable
