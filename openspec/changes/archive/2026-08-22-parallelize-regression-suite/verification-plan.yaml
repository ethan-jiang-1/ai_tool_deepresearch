schema_version: verification-routing/v1
change: 2026-08-22-parallelize-regression-suite
test_classes:
  unit:
    status: not_applicable
    rationale: >-
      No in-process module/schema/helper contract is newly proved or changed;
      the additive harness helper is exercised through the existing
      integration suites, not by a new unit claim.
  integration:
    status: selected
    rationale: >-
      The seven CLI integration suites are the proof assets: each must still
      pass its full scenario matrix (production CLI invocations and disposable
      bundles) after its snapshot root moves from the shared fixed
      tests/.test-bundles/.baseline-snapshot path to a per-file unique root.
  deterministic_e2e:
    status: not_applicable
    rationale: >-
      No workflow-scale deterministic chain asset changes; the e2e suites
      already pass per-run tmpdir snapshot roots and are untouched.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      This change repairs deterministic test-harness execution safety only; it
      makes no claim about real Agent or Subject-Agent behavior.
claims:
  - id: wave0-snapshot-isolation
    statement: >-
      RWG-001, RWG-004: the gate-wave0-complete scenario matrix still passes
      with a per-file unique snapshot root (token 'wave0') under default
      parallel execution, and no fixed shared snapshot path remains for this
      file.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/check-gate-wave0-complete.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
