      The changed surfaces are integration CLI gate/queue matrices; no unit
      surface is touched.
  integration:
    status: selected
    rationale: >-
      The gate verdict and queue-validation facts are proven through the
      production gate/inspect/operate-queue CLIs against restored empty
      bundle baselines; every leaf's assertions unchanged.
  deterministic_e2e:
    status: not_applicable
