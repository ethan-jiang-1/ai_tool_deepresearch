schema_version: verification-routing/v1
change: repair-gate-feedback-carrier-glossary
test_classes:
  unit:
    status: selected
    rationale: >-
      work-unit recovery 决策表与词汇表两个既有 unit 锁零改动保持绿，证明
      work-unit 侧 recovery_action 契约不受本 change 影响。
  integration:
    status: selected
    rationale: >-
      md 锁测试从 GATE_REPAIR_KINDS 派生并单点持有 negative lock；跨文件、
      真实文件树、无网络、无 Agent 执行。
  deterministic_e2e:
    status: not_applicable
    rationale: 无 lifecycle/gate/recovery 行为变化，不驱动端到端 bundle 链。
  agent_flow_e2e:
    status: not_applicable
    rationale: 不声称任何真实 Agent 行为变化；纯 guidance 投影与测试锁修正。
