schema_version: semantic-closure/v1
change: megablock-requirement-split
status: not_applicable
reason: >-
  本 change 是 requirement 粒度修复：11 个 ≥190 行 requirement 块按既有深挖设计
  拆为 27 个单主题子块，文本逐字守恒、场景与所行使规则同置。不改变任何 requirement
  的语义结论，不改变 engine 模块/checker 的确定性判定，不新增或改变 verdict consumer、
  runtime state、projection、status 或 reader-facing view。catalog
  （openspec/governance/semantic-fact-families.yaml）全部 family 的 bounded_question
  与 verdict 归属在拆分前后保持不变——同一语义结论仍由同一 engine 模块产出、被同一
  surface 消费，只是粒度更细的组织形式，故无 affected family。
