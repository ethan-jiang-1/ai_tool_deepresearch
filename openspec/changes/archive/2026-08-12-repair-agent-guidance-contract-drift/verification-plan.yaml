schema_version: verification-routing/v1
change: repair-agent-guidance-contract-drift
test_classes:
  unit:
    status: selected
    rationale: >-
      The setup-preflight test directly reads the committed Node baseline and
      related static setup surfaces without invoking a production CLI or
      exercising a runtime bundle.
  integration:
    status: selected
    rationale: >-
      The affected tests read independently owned Markdown and release
      surfaces, making them deterministic integration contracts with native
      node:test exit verdicts.
  deterministic_e2e:
    status: not_applicable
    rationale: >-
      No workflow-scale runtime lifecycle, temporary bundle, or production
      checkpoint behavior changes.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      The change makes no claim about real Playbook-Agent or Subject-Agent
      behavior and does not run a real Agent experiment.
claims:
