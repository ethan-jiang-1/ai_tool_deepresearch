    statement: >-
      ACS-002: the setup-preflight static test follows the committed Node 22
      `.nvmrc` baseline without changing the setup path, dependencies, or host
      permission behavior.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/setup-preflight-docs.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: hitl1-controls-selector-drift
