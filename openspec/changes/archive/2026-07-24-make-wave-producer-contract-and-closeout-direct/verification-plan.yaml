schema_version: verification-routing/v1
change: make-wave-producer-contract-and-closeout-direct
test_classes:
  unit:
    status: not_applicable
    rationale: This change does not alter a pure JavaScript or schema contract; it delivers existing guidance and leaves the reference parser and work-unit Engine behavior unchanged.
  integration:
    status: selected
    rationale: Static loading of the actual Markdown guidance can prove template delivery, ownership boundaries, and required command/checklist order without claiming that an Agent followed the prose.
  deterministic_e2e:
    status: not_applicable
    rationale: No deterministic workflow contract changes. A simulated bundle chain would duplicate existing submit/inspect coverage while being unable to establish the guidance-following behavior this change addresses.
  agent_flow_e2e:
    status: selected
    rationale: Only a real independent Phase Agent in a real disposable bundle can prove that it reads the revised guidance, acts after a real child return, and completes the returned-work/closeout loop. Unavailable capability remains NOT_RUN.
claims:
  - id: wave-producer-guidance-delivers-existing-contract
    statement: "The actual Wave0 source-intake delivery chain loads the existing rich-reference template while preserving direct Sub-agent output ownership, and Wave1 guidance requires dry-submit before formal submit plus one submitted-backed Phase closeout checklist before full-drain inspect."
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/wave-producer-contract-guidance.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: real-wave1-phase-returned-work-closeout
    statement: "In a real disposable Wave1 bundle, an independent Phase Agent follows the returned-work boundary after a real dpt-evidence-extractor child return: it preserves native child evidence, runs dry-submit before formal submit, performs the existing submitted-backed Phase closeout, then runs inspect. PASS requires retained native Subject and deterministic bundle evidence; unavailable Agent, child, tool, or external capability is NOT_RUN."
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wfn_wave1/case-225-heavy-returned-work-closeout.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: real
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
