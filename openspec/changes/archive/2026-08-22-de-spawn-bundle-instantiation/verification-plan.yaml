schema_version: verification-routing/v1
change: 2026-08-22-de-spawn-bundle-instantiation
test_classes:
  unit:
    status: not_applicable
    rationale: >-
      No in-process module/schema/helper contract is newly proved; the
      additive clone helper is exercised through the existing integration/e2e
      suites, not by a new unit claim.
  integration:
    status: selected
    rationale: >-
      Five CLI integration suites are the proof assets: each must still pass
      its full scenario matrix (production CLI invocations and disposable
      bundles) after per-test instantiation spawns become template clones.
  deterministic_e2e:
    status: selected
    rationale: >-
      The Wave1 carried-target receipt to Wave2 closure e2e suite keeps its
      deterministic chain (production checkpoints unchanged) while its bundle
      setup becomes a template clone.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      This change repairs deterministic test-harness setup only; it makes no
      claim about real Agent or Subject-Agent behavior.
claims:
  - id: wave1-complete-template-clone
    statement: >-
      RWG-002, RWG-005, WAI-005: the gate-wave1-complete scenario matrix still
      passes with one before()-built template and per-test cpSync clones
      (33 instantiation spawns -> 1), with plan_basename/status semantics
      unchanged.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/check-gate-wave1-complete.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
