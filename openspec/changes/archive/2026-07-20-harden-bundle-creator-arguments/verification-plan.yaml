schema_version: verification-routing/v1
change: harden-bundle-creator-arguments
test_classes:
  unit:
    status: not_applicable
    rationale: The behavior is only meaningful at the real creator child-process and filesystem boundary; extracting a parser-only proof would not prove absence of writes.
  integration:
    status: selected
    rationale: Actual creator CLIs must parse argv and preserve explicit temporary target directories without writing invalid bundles, while legal invocations retain their existing creation behavior.
  deterministic_e2e:
    status: not_applicable
    rationale: No multi-phase runtime workflow, state transition, or simulated Agent action changes; creator input validation ends before bundle creation on rejection.
  agent_flow_e2e:
    status: not_applicable
    rationale: The change proves deterministic CLI safety only and makes no claim about Playbook or Subject Agent behavior.
claims:
  - id: disposable-creator-prewrite-argument-boundary
    statement: The actual disposable creator gives a standalone pre-delimiter --help option precedence with zero writes while delimiter-protected --help remains an invalid positional; otherwise it clearly rejects unknown, repeated, missing-valued, unsafe name/non-canonical case, and extra positional input before creating a supplied target root or any dpt_disp bundle. A target path containing spaces and a double quote reaches validation/inspection as a literal argument, while legal case-target and nodes-copy behavior plus all-hex-slot disposable force overwrite behavior remain compatible.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/experiments_env/new-disposable-bundle.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: production-creator-prewrite-argument-boundary
    statement: The actual production creator gives a standalone pre-delimiter --help option precedence with zero writes while delimiter-protected --help remains an invalid positional; otherwise it clearly rejects unknown, repeated, missing-valued, unsafe name, and extra positional input before creating a supplied target root or any dpt_rb bundle. A target path containing spaces and a double quote reaches validation/inspection as a literal argument, while legal explicit-target creation and the existing force prohibition remain compatible.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/instantiate-run-bundle.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
