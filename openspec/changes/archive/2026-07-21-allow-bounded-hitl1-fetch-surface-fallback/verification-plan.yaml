schema_version: verification-routing/v1
change: allow-bounded-hitl1-fetch-surface-fallback
test_classes:
  unit:
    status: not_applicable
    rationale: The change adds no independently exported pure module, schema or state function; the verification-only observer branch crosses transcript, profile and trace boundaries and is exercised through its focused integration entry rather than duplicated as a unit-level truth path.
  integration:
    status: selected
    rationale: Focused Node tests must verify the production HITL1 Markdown and existing case-115 observer wiring expose one search, only its first actual HTTP(S) result when eligible, at most one native attempt, at most one exact standalone same-URL curl fallback, shell/URL/permission safety boundaries, stable-ID public-event normalization, existing observation ownership and no evidence leakage or user command handoff.
  deterministic_e2e:
    status: not_applicable
    rationale: No deterministic multi-phase transition, Gate implementation, schema or persisted-state chain changes; a JS-led workflow cannot prove native fetch or curl behavior.
  agent_flow_e2e:
    status: selected
    rationale: Only a real authenticated Subject Agent using actual native and shell surfaces can prove it performs the bounded same-URL fallback, writes the existing observation and reruns the real Gate without a user co-runner or fabricated page content.
claims:
  - id: hitl1-bounded-fetch-guidance-contract
    statement: The production HITL1 node retains stop:yes and capability_probe_only, permits exactly one neutral search and only its first actual HTTP(S) result when eligible without skipping to a second result, rejects shell-unsafe/credential/local/loopback/literal private or link-local targets, ends after native real-content success, otherwise permits at most one exact standalone single-quoted same-URL curl invocation with HTTP-error failure, a 15-second timeout, five-redirect cap, disabled URL globbing and HTTP(S)-only request/redirect protocols when independent host shell/network permission already allows it, writes only the existing research_access available/unavailable shape, keeps optional fetch_surface schema/Gate-compatible while requiring the current writer to name the successful surface, keeps probe bytes out of evidence surfaces, and exposes only a missing permission or external-environment boundary to the user.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/phase-hitl1-research-access.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: hitl1-fetch-fallback-case115-wiring
    statement: The existing manifest-registered case-115, Subject 115 runner and shared observer bind one legal HITL1 setup, one independent real Claude Subject, actual WebSearch/WebFetch plus Bash tools, stable-ID public-event normalization, the exact same-URL native-failure-to-curl-success optional trace witness, retained transcript/profile/Gate/evidence-boundary facts, and observer-exit-3 to native-NOT_RUN translation without another Subject identity, embedded duplicate parser, observer-authored fallback, profile success, page bytes or native completion.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/experiments_env/hitl1-fetch-fallback-observer.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: hitl1-general-research-access-agent-flow
    statement: From one legal setup-only HITL1 bundle, an independent authenticated Claude Subject Agent follows the current production bounded probe, writes exactly one existing research_access observation, runs the real hitl1-recorded Gate and either consumes the available Setup handoff or remains honestly unavailable, while probe URL/content never enters evidence, cache, artifact, work-unit or output-ledger surfaces; the general case-115 PASS does not imply the fallback branch ran or prove another Coding Agent runtime.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wff_pre-research-repair/case-115-heavy-hitl1-research-access-probe.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: real
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
  - id: hitl1-native-to-curl-fallback-agent-flow
    statement: From one legal setup-only HITL1 bundle in the authenticated Claude Subject runtime where the first structured WebSearch HTTP(S) result is eligible, WebFetch fails without real content and independently authorized curl can fetch it, complete normalized public Subject/direct bundle facts produce the playbook-owned hitl1-native-to-curl-fallback trace check proving one search, the same URL, one native attempt and one exact standalone curl attempt in that order, a non-error/non-empty curl tool result accepted by the Subject as requested page content, research_access available with fetch_surface curl, a real hitl1-recorded Gate pass and Setup handoff, no user command handoff, no second URL/tier and no probe evidence leakage; absence of that exact branch leaves this claim NOT_RUN without failing case-115's general required checks, claiming Codex behavior, re-judging arbitrary HTML or substituting a fixture/narrated PASS.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wff_pre-research-repair/case-115-heavy-hitl1-research-access-probe.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: real
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
