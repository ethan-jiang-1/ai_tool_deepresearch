schema_version: verification-routing/v1
change: extract-topic-schema-projection
test_classes:
  unit:
    status: selected
    rationale: >-
      canonical-topic-state 的现有 unit/integration 测试通过 node:test 断言
      锁定其行为；本 change 不改变行为，npm test 全绿即证明新文件 + re-export
      与原始函数等价。
  integration:
    status: selected
    rationale: >-
      finalizer 隔离 fixture 链（change-feedback-loop-archive）证明重构不破坏
      归档机检链。
  deterministic_e2e:
    status: not_applicable
    rationale: 无 lifecycle/gate/recovery 行为变化。
  agent_flow_e2e:
    status: not_applicable
    rationale: 不声称任何真实 Agent 行为变化。
claims:
