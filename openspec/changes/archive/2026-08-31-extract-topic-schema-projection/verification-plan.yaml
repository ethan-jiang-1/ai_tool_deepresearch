      全绿、原文件 re-export 使 importer 零改动。
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/canonical-topic-state.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: archive-mechanics-intact-after-refactor
    statement: >-
      隔离 fixture 中 governed finalizer 完整检查序列全绿并完成归档：重构不
      破坏归档机检链。
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/governance/change-feedback-loop-archive.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit