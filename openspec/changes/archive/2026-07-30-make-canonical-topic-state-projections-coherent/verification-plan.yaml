schema_version: verification-routing/v1
change: make-canonical-topic-state-projections-coherent
test_classes:
  unit:
    status: selected
    rationale: Submission-bound contribution facts, semantic prefix comparison, entry parsing, navigation classification, seed structure, and style freshness are deterministic helper and transaction boundaries.
  integration:
    status: selected
    rationale: Production submit, topic-state, inspect, and Gate CLIs, plus their declared Markdown control surfaces, must expose the same direct roots and existing-writer feedback without a workflow-scale simulation.
  deterministic_e2e:
    status: not_applicable
    rationale: C2 changes deterministic writer/reader and checkpoint contracts without adding or changing a multi-phase transition; selected production CLI integrations cover the affected lifecycle windows without simulating a full workflow chain.
  agent_flow_e2e:
    status: not_applicable
    rationale: C2 improves deterministic feedback and Markdown guidance but makes no claim that a real Agent performs research, repairs a bundle, or follows a host lifecycle.
claims:
  - id: wave0-submit-records-narrow-contribution
    statement: >-
      DEW-005: first acceptance of a current Wave0 source intake records an Engine-derived, hash-bound contribution declaration while duplicate and late-submit replay retain it and non-Wave0 output remains outside the feature.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/work-unit-submit.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: lost-wave0-contribution-witness-fails-closed
    statement: >-
      DEW-005: after a production current Wave0 submit, source mutation plus deletion of its contribution-bearing ledger row cannot make recover-declaration recreate provenance from live bytes or append a replacement row; it returns one missing-contract/no-legal-recovery result.
