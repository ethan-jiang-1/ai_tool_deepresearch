schema_version: verification-routing/v1
change: deliver-work-unit-role-contracts-to-actors
test_classes:
  unit:
    status: selected
    rationale: Pure closed role-guidance derivation and direct-contract actor descriptors need focused fail-closed and parity proof without filesystem envelope orchestration.
  integration:
    status: selected
    rationale: Real claim/envelope generation and shipped Markdown boundaries must prove task/spawn delivery, absolute refs, supplementary compatibility, shared fetch guidance and no duplicate validator or Python fallback.
  deterministic_e2e:
    status: not_applicable
    rationale: The Change adds no persisted state, schema, Gate, transition or multi-phase deterministic chain; existing claim/dry-submit/submit integration remains the authority path.
  agent_flow_e2e:
    status: selected
    rationale: Only real dpt-evidence-extractor actors using generated task guidance and actual search/fetch surfaces can prove first-return authoring compliance or delegated fallback behavior.
claims:
  - id: work-unit-contract-projection-owner
    statement: Closed registered delegated role keys derive one contained shipped role/shared-guidance projection, and every closed direct-output contract ID exposes a bounded actor descriptor from the same owner as its evaluator; unknown, mismatched, missing or escaping facts fail before actor work without a new registry, persisted marker or validator.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/work-unit-contract-delivery.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: generated-envelope-delivers-role-and-authoring-contract
    statement: Real current primary Wave1 claim generation projects the same canonical role/shared absolute refs and contract-owned minimum authoring semantics into task and spawn prompt, keeps exact assignment/result/schema bindings and supplementary empty-required-output behavior, and publishes no partial envelope for invalid lineage.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/engine/work-unit-role-contract-delivery.test.mjs
    execution_profile:
      fixture: minimal
      subject_execution: none
      runtime: disposable_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: shared-delegated-fetch-guidance-contract
    statement: Active search/fetch roles and shared protocol deliver one canonical per-URL built-in/browser/Node-first then bounded same-URL curl guidance with independent permission, batching, cache/source/receipt and exhausted-failure boundaries, while role-local duplicate chains, Python, wget, automatic retry and user command handoff are absent.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/subagent-fetch-contract-delivery.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: wave1-actor-first-return-contract-compliance
    statement: Existing case-221 launches real dpt-evidence-extractor actors from generated task-directed surfaces; actor-owned first-return paired output bytes already satisfy the existing direct contracts before Phase/Playbook repair, retain real source/cache/result/receipt facts, and reach formal submit/ledger/Gate through the existing authority path.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wfn_wave1/case-221-heavy-batch-subagent.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: real
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
  - id: wave1-actor-native-to-curl-fallback
    statement: In the same retained case-221 evidence, a real actor whose native fetch returns no real content and whose independently authorized bounded same-URL curl returns real page content records truthful cache/source/receipt facts and submits through the existing contract; absence of that exact public branch is claim-level NOT_RUN without relabeling the general case or proving another runtime.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wfn_wave1/case-221-heavy-batch-subagent.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: real
      verdict_judge: deterministic
    verdict_authority: trace_jsonl

