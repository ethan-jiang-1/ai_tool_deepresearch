schema_version: verification-routing/v1
change: repair-wave1-reference-closeout-feedback
test_classes:
  unit:
    status: selected
    rationale: >-
      Root precedence, supplementary-row classification, locator constants,
      and Wave2 missing-finding feedback are bounded deterministic projections
      over controlled facts.
  integration:
    status: selected
    rationale: >-
      Production CLI and Markdown contract tests prove public inspect/Gate
      feedback and Agent-facing ordering across independently owned surfaces.
  deterministic_e2e:
    status: not_applicable
    rationale: >-
      The change does not alter a workflow-scale transition or require a full
      multi-phase run to establish its deterministic closeout behavior.
  agent_flow_e2e:
    status: not_applicable
    rationale: >-
      The claims concern deterministic resolver, feedback, and documentation
      contracts, not real Agent research or semantic authoring behavior.
claims:
  - id: wave1-backing-root-precedence
    statement: >-
      WAI-005 and RWG-017: an unusable submitted-backing root wins before
      synthetic null Topic/profile guards, while unrelated canonical Topic
      failure retains its own root.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/wave1-reference-convergence.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: wave1-locator-implementation-regression
    statement: >-
      REF-011: normalization-sensitive input and a long token retain the
      current canonical locator behavior without publishing truncation or
      digest lengths as an Agent-facing contract.
