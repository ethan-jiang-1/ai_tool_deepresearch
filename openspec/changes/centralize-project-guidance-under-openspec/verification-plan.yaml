schema_version: verification-routing/v1
change: centralize-project-guidance-under-openspec
test_classes:
  unit:
    status: not_applicable
    rationale: This change adds no isolated JavaScript behavior outside the selected documentation contracts.
  integration:
    status: selected
    rationale: Current entry routes, role-aware guidance hierarchy, supported operation paths, and knowledge pointers are cross-surface deterministic contracts.
  deterministic_e2e:
    status: not_applicable
    rationale: The migration does not execute a workflow-scale deterministic runtime chain.
  agent_flow_e2e:
    status: not_applicable
    rationale: No real Agent behavior claim changes; this plan proves repository topology, not actual document-reading behavior.
