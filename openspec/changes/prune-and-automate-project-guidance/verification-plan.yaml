schema_version: verification-routing/v1
change: prune-and-automate-project-guidance
test_classes:
  unit:
    status: not_applicable
    rationale: The change adds no isolated JavaScript behavior outside the selected cross-surface documentation contracts.
  integration:
    status: selected
    rationale: Guidance ownership, entry routing, configuration-delivered operation guidance, and current topology are repository cross-surface deterministic contracts.
  deterministic_e2e:
    status: not_applicable
    rationale: The change does not execute a workflow-scale deterministic runtime chain.
  agent_flow_e2e:
    status: not_applicable
    rationale: The change preserves documentation and static topology; it makes no real Agent-behavior claim.
