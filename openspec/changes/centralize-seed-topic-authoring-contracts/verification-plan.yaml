schema_version: verification-routing/v1
change: centralize-seed-topic-authoring-contracts
test_classes:
  unit:
    status: selected
    rationale: Seed renderer parity and rerun-direction parsing are focused deterministic contracts over structured input and Markdown bytes.
  integration:
    status: selected
    rationale: The shipped workflow package must resolve two focused shared contracts through real requires chains, preserve generated-cue parity, and return root-first rerun-ready feedback over real temporary bundle structure.
  deterministic_e2e:
    status: selected
    rationale: Atomic direction publication, crash recovery, profile-count synchronization, and downstream action classification cross multiple production deterministic owners.
  agent_flow_e2e:
    status: selected
    rationale: Phase-rerun's changed required order is Agent-flow behavior. The existing case-318 real Subject Agent canary narrowly proves retained direction-only candidate/application and crash-window recovery from a supplied rationale; it does not claim universal affected-Topic inference or semantic direction quality.
claims:
  - id: seed-authoring-parity
    statement: The canonical new-seed renderer and focused shared seed authoring contract expose the same ordered research-appendix headings, owning headings, and one-time token set while presentation prose, YAML order, and whitespace remain non-authoritative.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/canonical-topic-state.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: topic-state-atomic-direction-publication
    statement: Sanctioned rerun add, update, and direction-only actions validate target count and action mapping before prepared publication, atomically stage every touched seed direction in the existing workspace, recover exact bytes after accepted publication, preserve layout-only guidance, and keep HITL1 direction-free.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/operate-topic-state-direction.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: direction-structure-compatibility
    statement: One focused rerun-direction parser/evaluator preserves matching, stale, future, legacy-unbound, and invalid classification; accepts tolerated heading/list/bold presentation; validates canonical action and non-empty current/future fields; tolerates non-conflicting extensions; rejects ambiguity; and never judges guidance semantics.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/rerun-direction.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: focused-shared-contract-reachability
    statement: The shipped workflow loads the seed authoring contract only at seed/rerun decision points and the return-map authoring contract through the seed/Wave phase requires chains, while applicable role guidance keeps only static cues; it retains one complete definition per concern and keeps generated work-unit cues self-contained with static five-field and authority parity.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/seed-topic-authoring-contract.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: plan-bound-rerun-ready-feedback
    statement: The existing rerun-ready CLI derives current seed scope from the canonical plan, reuses focused seed binding, masks dependent direction symptoms behind prerequisite roots, blocks malformed current/future structure at exact coordinates, and keeps a complete future candidate failed at the existing profile-count owner while ignoring orphan seed files.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/check-gate-rerun-ready.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: rerun-direction-continuity
    statement: Given fixture-labeled simulated Agent action input, the production deterministic rerun chain atomically publishes complete add, update, or direction-only candidates; recovers accepted bytes; refuses to treat old matching direction sections as a new transaction receipt; synchronizes profile count through its existing owner; preserves layout-only guidance; and lets downstream consumers activate only the completed matching direction.
    test_class: deterministic_e2e
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/e2e/rerun-round-continuity.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: simulated_agent_actions
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: real-agent-rerun-transaction-recovery
    statement: Given a legal setup-only rerun boundary and recorded rationale, a real Subject Agent retains one direction-only candidate, invokes the existing topic-state apply owner, leaves a complete future direction before profile increment, then preserves its bytes while using the existing profile-count, rerun-ready, and Seed Topics handoff path. This proves only the named Agent-flow procedure, not universal Topic inference or semantic quality.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wfn_rerun/case-318-heavy-rerun-direction-recovery.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
