schema_version: verification-routing/v1
change: reuse-delegated-output-contracts-at-submit
test_classes:
  unit:
    status: selected
    rationale: Closed assignment resolution, strict contract schemas, bounded byte snapshots, tolerant direct parsing, root short-circuiting, repair classification, and legacy-marker selection are focused deterministic contracts.
  integration:
    status: selected
    rationale: Claim projections, CLI candidate checkpoints, formal acceptance/replay paths, current Wave adapters, and Agent-facing Markdown cross real production module and temporary-bundle boundaries.
  deterministic_e2e:
    status: not_applicable
    rationale: The change adds no new workflow transition or multi-phase state chain; focused integration tests cover the affected claim, submit, timeout, replay, Wave, and compatibility boundaries with less harness complexity.
  agent_flow_e2e:
    status: selected
    rationale: Preserving authorship after a real actor returns semantically incomplete required output is Agent-flow behavior; a registered real-Sub-agent canary must prove explicit terminalization and replacement without Phase-Agent semantic substitution.
claims:
  - id: assignment-contract-resolution
    statement: The current closed resolver derives only supported Wave0 exact source YAML, primary paired Wave1, supplementary empty-output Wave1, and empty-output Wave2 contracts from kind plus snapshot-bound canonical Topic and file receipts; it rejects overrides, unsafe or conflicting assignments, and unknown marker values without writes_to or queue-ID inference.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/direct-output-contract.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: bounded-direct-output-evaluation
    statement: One direct-output interface reads at most 4 MiB from one opened regular-file handle, rejects unsafe, escaping, stable-symlink, special-file, oversize, read, and invalid-UTF8 targets, strips one BOM, and returns the same tolerant Wave0 schema and Wave1 semantic-section roots with prerequisite short-circuiting.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/direct-output-contract.test.mjs
    execution_profile:
