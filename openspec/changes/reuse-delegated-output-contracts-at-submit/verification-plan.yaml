  - id: real-agent-semantic-replacement
    statement: Given setup-only Topic and queue prerequisites, one independent real Subject Agent acts as Phase Agent across three bounded turns. Turn 1 claims a current primary Wave1 attempt, invokes a first real child that performs bounded search/fetch and owns its source/cache/candidate/work_done with one controlled empty semantic section, saves native dry-submit repair_scope/recommended_action/primary_root_code JSON, and pauses for first-output hashing. Turn 2 consumes that rejection, does not change first-output hashes, runs non-retry fail with the Engine-derived semantic_contract reason, enqueues the same primary paired obligation under a fresh queue_item_id absent from every durable location, claims a new work ID, and pauses before overwrite. Turn 3 invokes a second real child that independently owns valid search/fetch/source/cache/output and submits only that replacement. Case-owned deterministic checks derive trace verdicts from retained native CLI JSON, Subject/child evidence and pause hashes without fabricating production events. PASS proves only this recovery procedure, not research quality or universal compliance.
