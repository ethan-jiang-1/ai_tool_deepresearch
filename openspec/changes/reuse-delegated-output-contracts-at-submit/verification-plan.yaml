    statement: The current closed resolver derives only supported Wave0 exact source YAML, assignment_mode primary plus paired Wave1, assignment_mode supplementary plus empty-output Wave1, and empty-output Wave2 contracts from kind plus snapshot-bound canonical Topic and file receipts; it rejects missing/mismatched mode, direct selectors, unsafe or conflicting assignments, and unknown marker values without writes_to or queue-ID inference.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/direct-output-contract.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
