schema_version: verification-routing/v1
change: reuse-delegated-output-contracts-at-submit
test_classes:
  unit:
    status: selected
    rationale: Closed assignment resolution, strict contract schemas, target-level bounded snapshots, tolerant direct parsing, root short-circuiting, repair classification, and legacy-marker selection are focused deterministic contracts.
  integration:
    status: selected
    rationale: Claim projections, CLI candidate checkpoints, formal acceptance/replay paths, current Wave adapters, and Agent-facing Markdown cross real production module and temporary-bundle boundaries.
  deterministic_e2e:
    status: not_applicable
    rationale: The change adds no new workflow transition or multi-phase state chain; focused integration tests cover the affected claim, submit, timeout, replay, Wave, and compatibility boundaries with less harness complexity.
  agent_flow_e2e:
    status: selected
    rationale: Preserving authorship after work_done semantic rejection is Phase-Agent behavior; a registered independent real Subject Agent must consume the rejection, avoid semantic substitution, and execute explicit same-obligation replacement with a real child actor or report native NOT_RUN.
