  - id: strict-work-unit-contract-schema
    statement: Work-unit index, manifest, beacon, output contract, and generated result schema accept the current assignment marker and unique closed path-role-direct-contract tuples, preserve genuine marker-absent legacy records, and reject partial markers, unknown contracts, projection drift, duplicate paths, wrong roles, and actor-selectable contract fields.
