schema_version: verification-routing/v1
change: formalize-verification-routing
test_classes:
  unit:
    status: selected
    rationale: Focused parser and direction-resolver contracts need fast isolated node:test coverage.
  integration:
    status: selected
    rationale: The route checker and current-round authority claims cross real CLI, filesystem, or temporary-bundle boundaries.
  deterministic_e2e:
    status: selected
    rationale: A JS-led full chain must exercise state combinations, fail-closed behavior, and recovery through production Engine paths without claiming Agent intelligence.
  agent_flow_e2e:
    status: selected
    rationale: A real Agent must execute the Markdown phase-rerun flow over a real disposable run bundle to prove direction production and recovery behavior.
claims:
  - id: routing-contract-schema
    statement: The shared strict parser rejects invalid route documents and incompatible cross-field combinations without accessing repository assets or mutating state.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/governance/verification-routing-contract.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: routing-checker-plan-and-assets-contract
    statement: The read-only checker CLI rejects unsafe, missing, or unregistered assets through its real process and filesystem boundaries without executing evidence paths or mutating repository state.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/governance/check-verification-routing.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: rerun-direction-engine-contract
    statement: The direction resolver returns the accepted matching, stale, future, legacy-unbound, and invalid states for rerun-count combinations.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/wave-contract-evaluators-direction.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: rerun-current-round-cli-contract
    statement: The real work-unit inspect CLI returns only current-round eligible submitted rows, reports legacy exclusions, and fails closed on inconsistent authority.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/rerun-round-continuity.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: verification-knowledge-surface-contract
    statement: High-frequency repository guidance surfaces expose the four canonical test-class identifiers and owned directory pointers without restoring ordinal, regression-only, controlled-E2E, or runtime-distance peer taxonomies.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/verification-routing-knowledge-surfaces.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: rerun-deterministic-full-chain
    statement: A runtime-generated legal baseline can traverse the deterministic rerun chain, while injected state and artifact faults fail or recover through their real production consumers without fabricated Engine authority.
    test_class: deterministic_e2e
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/e2e/rerun-round-continuity.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: simulated_agent_actions
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: rerun-direction-agent-recovery
    statement: A real Agent follows phase-rerun guidance to write the current direction and recover the controlled direction-profile interruption after the setup-only fixture boundary.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wfn_rerun/case-318-heavy-rerun-direction-recovery.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
