schema_version: verification-routing/v1
change: simplify-iterative-research-interaction
test_classes:
  unit:
    status: selected
    rationale: The continuation cue enum and next-action mapping are a small pure deterministic projection over node frontmatter and direct command outcomes.
  integration:
    status: selected
    rationale: Real Gate, enter-phase, advance-status, queue/topic-state and work-unit/generated-task outputs, stop:no action-bearing finding producers, Agent-facing Markdown/headers, active Gate-definition boundaries and active experiment surfaces cross production module/filesystem boundaries.
  deterministic_e2e:
    status: not_applicable
    rationale: The change does not alter lifecycle transitions or a workflow-scale deterministic state chain; repeating the existing JS-led chain would not prove natural-language or user-initiated-turn Agent behavior.
  agent_flow_e2e:
    status: selected
    rationale: Real subject Agents must generate recommendations from production guidance, demonstrate natural-language acceptance/rerun translation and answer a user-initiated non-HITL turn without a third checkpoint or fabricated authority.
claims:
  - id: continuation-cue-initiation-contract
    statement: The pure continuation projection maps every non-terminal stop:no loaded-node, Gate pass/fail and successful claim decision point to interaction:do_not_initiate while preserving required, terminal_delivery, next_action and locator semantics without chat or persistent state.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/helpers/continuation-cue.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: continuation-cli-projection-contract
    statement: Real Gate, enter-phase, covered advance-status and successful work-unit claim outputs expose do_not_initiate with their existing immediate next actions, while HITL and Final projections remain required and terminal_delivery; representative rerun, seed-topics, queue, canonical topic-state, generated work-unit task, Wave1 and Wave2 stop:no failures preserve verdict, route and true structured boundary owners while action-bearing advice does not command immediate user contact, HITL/rerun entry, blocker surfacing or user involvement; a recorded-profile missing-style failure names the existing apply-research-style Engine operation; command state/trace diffs remain within existing authority and output adds no chat, pause, permission or interaction-state field.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/continuation-initiation-contract.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: interaction-markdown-contract
    statement: Enumerated owner surfaces declare recommendation-first HITL1/HITL2 prompts, permit natural-language acceptance/correction at those boundaries, use semantic progress rather than fixed-round nudges, require answers to user-initiated turns while prohibiting only framework-initiated stop:no surfacing, treat repair_kind and timeout block as Agent-facing responsibility rather than interaction timing across every non-terminal stop:no consumer, make missing_contract a stated unavailable boundary rather than a requested acknowledgement, keep Final terminal delivery without silencing an already-current verified-fact turn or changing terminal_delivery/deliver_final_artifacts, distinguish retained history from revisable current judgment, and contain no blanket confirmation, automatic boundary-hint/blocker escalation, absolute user-unavailable rule, retired search_preference/sentinel, gap_queue_backed text trigger or nonexistent prompt owner. The HITL2 phase owns one read-only inline Node ESM import of the existing loader, validates exact supported rerun rule identity/shape and nonnegative current count, fails closed without state/trace writes, and suppresses rerun when current_count = limit - 1 would increment to the exclusive limit; the brief does not duplicate that invocation.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/md/iterative-interaction-contract.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: rerun-limit-active-definition-contract
    statement: The rerun-ready Gate boundary test and active case-304 experiment read the production-parsed active Gate rule, accept the post-increment value immediately below its exclusive limit, reject values at and above it, and remove copied legacy numeric claims from active docs, registry, tests and experiment index without changing the definition or unrelated fatigue threshold.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/check-gate-rerun-ready.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: hitl1-natural-language-agent-flow
    statement: From a legal HITL1 setup with research_access unprobed and no subject facts, a real subject Agent reads production guidance, generates the recommendation, treats one unambiguous natural-language acceptance as confirmation, performs the bounded real probe, writes only existing profile/topic owners, runs the real Gate and enters a bounded stop:no segment without a second confirmation, framework-initiated surfacing or human command co-runner.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_iterative_interaction/case-711-heavy-hitl1-natural-acceptance.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: real
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
  - id: hitl2-natural-language-rerun-agent-flow
    statement: From direct facts where the active rerun rule permits the required next increment, a real subject Agent generates the HITL2 research review and one available recommendation from production guidance, then receives one natural-language request to continue a stated direction, records the existing rerun decision/rationale, runs the real Gate and consumes the existing handoff without a second user response or canonical enum in user-facing assistant blocks.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_iterative_interaction/case-712-heavy-hitl2-natural-rerun.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
  - id: user-initiated-turn-boundary-agent-flow
    statement: A real subject Agent answers a normal user-initiated turn about two seeded direct bundle facts while a non-HITL stop:no node is active; transcript/hash and before/after authority facts prove the current node/status and projected autonomous next_action remain unchanged with no HITL/profile/permission or pause/interrupt state created.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_iterative_interaction/case-713-heavy-user-initiated-turn.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_agent
      runtime: real_disposable_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
