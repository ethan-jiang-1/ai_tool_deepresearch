schema_version: verification-routing/v1
change: make-delegated-work-contracts-constructible
test_classes:
  unit:
    status: selected
    rationale: Closed observation vocabulary and candidate-root selection are pure deterministic transformations; they need direct negative and parity coverage without a bundle or actor runtime.
  integration:
    status: selected
    rationale: Claim CLI, generated envelope, dry-submit/formal rejection, timeout-preflight, and historical envelope compatibility cross real bundle authority surfaces and must prove no-mutation/no-precreation behavior.
  deterministic_e2e:
    status: not_applicable
    rationale: This Change adds no persistent state, Gate, transition, or workflow-scale deterministic chain; existing claim-to-submit integration remains the deterministic authority path.
  agent_flow_e2e:
    status: selected
    rationale: Only a real dpt-evidence-extractor using the generated completion entry can establish that the new decision-point delivery is actually read before first returned work; deterministic tests cannot claim that behavior.
claims:
  - id: closed-observation-and-primary-root-owner
    statement: One closed observation-case definition drives schema validity and the structured claim vocabulary, while one candidate-root selection drives recommended action and every public primary repair detail; contradictory tuples and mismatched primary fields have no alternate success interpretation.
    test_class: unit
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/engine/work-unit-contract-constructibility.test.mjs
    execution_profile:
      fixture: none
      subject_execution: none
      runtime: none
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: claim-and-envelope-constructibility-boundary
    statement: A real current Wave0/primary-or-supplementary-Wave1 claim returns a role-bound invalid/no-claim vocabulary without mutation, and every new successful claim produces task, spawn and one completion-contract projection whose attempt facts equal the existing manifest/beacon/result-schema/output/cache/receipt owners without pre-creating actor or ledger authority files; historical attempts remain readable without backfill.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/engine/work-unit-contract-constructibility.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: root-first-submit-feedback-boundary
    statement: Real dry-submit, formal-submit rejection and timeout-preflight retain every independently evaluable diagnostic, suppress dependent symptoms after direct prerequisite failure, and expose primary action/code/repair details from one selected root without ledger, queue, result, receipt, cache or trace mutation by dry-submit.
    test_class: integration
    proof_subject: deterministic_contract
    asset:
      kind: node_test
      path: tests/integration/cli/operate-work-unit.test.mjs
    execution_profile:
      fixture: fixture_backed
      subject_execution: none
      runtime: temporary_bundle
      external_calls: none
      verdict_judge: deterministic
    verdict_authority: node_test_exit
  - id: actor-uses-generated-completion-entry
    statement: The existing registered Wave1 case launches real dpt-evidence-extractor actors from a claimed task, retains durable evidence that the generated completion contract was the actor's supplied authoring entry before first returned work, and evaluates submit/inspect/Gate from native runtime facts. PASS does not claim research quality; unavailable runtime is recorded as native NOT_RUN rather than replaced by a fixture or parent-authored output.
    test_class: agent_flow_e2e
    proof_subject: agent_behavior
    asset:
      kind: markdown_playbook
      path: experiments_playbook/exp_wfn_wave1/case-221-heavy-batch-subagent.md
    execution_profile:
      fixture: setup_only
      subject_execution: real_subagent
      runtime: real_disposable_bundle
      external_calls: real
      verdict_judge: deterministic
    verdict_authority: trace_jsonl
