schema_version: semantic-closure/v1
change: rebuild-hitl1-research-access-envelope
status: affected
catalog_additions:
  - id: research.host-access-envelope
    bounded_question: >-
      What research access does this run currently have, which boundary owns any
      unreachable part, and is that boundary universal or class-scoped?
affected:
  - family: research.host-access-envelope
    fact: >-
      Whether the recorded run access envelope admits research at all (at least
      one declared source class returned real requested page content), and for
      any unreachable part, which single boundary owns it (host_surface,
      host_policy, network_path, or probe_relay) and whether that boundary is
      universal or class_scoped. Owner determines the projected repair kind by
      derivation, not by a parallel declared field; an observation that
      establishes no routeable owner is legal but must be reported as
      explicitly unclassified rather than silently generalized.
    authority:
      resolver: DEEP_RESEARCH_HARNESS/host_tools/lib/research-access-adapter.mjs
    established_by:
      - DEEP_RESEARCH_HARNESS/workflows/nodes/phases/phase-hitl1.md
    consumers:
      - DEEP_RESEARCH_HARNESS/cli/gates/check-gate-hitl1-recorded.mjs
    overlap:
      - coordinate: DEEP_RESEARCH_HARNESS/schema/contracts/profile.mjs
        relation: authoritative
        detail: >-
          ProfileSchema owns the durable shape and closed enumerations of the
          recorded envelope, including the fixed-width source-class set. It
          validates structure and rejects a matrix-shaped observation; it does
          not decide admission or select the owning boundary.
      - coordinate: DEEP_RESEARCH_HARNESS/workflows/nodes/shared/shared-hitl1-capability-probe.md
        relation: derived
        detail: >-
          The isolated probe guide is an Agent-facing prompt that presents the
          declared source-class ladder and the classification vocabulary it must
          return. It produces a transient observation and holds no bundle,
          profile, or Gate authority; the Phase Agent alone persists it.
      - coordinate: DEEP_RESEARCH_HARNESS/host_tools/research-access-adapter.md
        relation: derived
        detail: >-
          The selected adapter contract declares the two classification axes and
          the owning host/policy boundaries that the resolver reads. It is a
          static declaration surface, not the runtime resolver of a recorded
          observation.
    verification:
      truth_table: tests/host_tools/research-access-adapter.test.mjs
      cross_surface: tests/integration/cli/check-gate-hitl1-recorded.test.mjs
