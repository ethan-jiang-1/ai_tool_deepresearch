schema: spec-driven

context: |
  Deep Research Tool — 将宽泛研究问题转化为证据支撑、多波次、带门控的研究报告。

  项目定位:
    这是一个 agentic framework。目录即约定，不依赖额外配置文件。
    Agent (LLM) 是执行者 (搜索、阅读、写作、综合、决策)，
    Engine (JavaScript) 是校验者 (Schema 验证、Gate 审计、Receipt 检查)，
    Markdown/JSON/YAML 文件是持久化状态。

  核心原则:
    - Engine (JavaScript) 强制执行规则 (schemas, state machines, receipts)
    - Agent (LLM) 生产内容 (搜索、阅读、写作、综合)
    - Markdown 控制 Agent Flow，JS/CLI 控制确定性 checkpoint
    - JS/CLI 的输出 (check/inspect/advice) 必须回到 conversation context，让 MD 读后继续行动
    - JS/CLI 不编排多阶段流程、不做语义判断、不替 Agent 选修复策略
    - Gate 不持有路由——Transition table 负责 Node 间转移，Gate 只问不猜
    - 绝对禁止用环境变量传递配置——Coding Agent 每个 tool call 是独立 shell，
      process.env 不跨 call。所有配置必须显式：CLI flag、函数参数、runtime 属性

  技术栈:
    Node.js ≥20, 纯 JavaScript (ESM, .mjs)。不使用 TypeScript。
    仅 2 个批准的 npm 依赖 (不可新增): zod (schema 校验), yaml (YAML 文件解析)。
    其余全部 Node.js 内置: node:util.parseArgs, node:fs/promises, node:test + node:assert, node:path。
    状态机: 显式转换表 (Map/object), 不用 XState。
    Markdown frontmatter: 正则提取 + JSON.parse(), 不用 gray-matter。

  LLM-JS 协作原则 (Check & Inspect):
    长程 Agent 任务中 LLM 易受噪声干扰产生幻觉。
    采用 C (Check 硬性验证) + I (Inspect 审视诊断) 双保险:
    - Check: JavaScript/Zod 在写入前校验 Schema、不变量、Receipt — 不通过则拒绝写入
    - Inspect: CLI 诊断工具事后审视 Gate 审计、交叉引用、证据质量 — 发现问题反馈给 LLM 反思纠正
    LLM 负责信息加工，JS 负责质量保证。验证失败 → 反馈 → 反思 → 纠正，不静默通过。

    JS/MD 边界判断:
      遇到"这段逻辑该放 JS 还是 MD"拿不准时，读 guidelines/project-charter.md 的
      "Operating Model" 节和 guidelines/framework-runtime-boundary.md 的
      "Agent-Engine Communication" 节。速判口诀：
        MD/Agent 侧：多阶段流程编排、修复策略选择、语义判断、branch 路由决策
        JS/Engine 侧：schema 校验、状态转移查询 (askNext)、receipt 检查、trace 写入
      Engine 提供注入点（函数参数），MD/Agent 提供实际逻辑。
      Engine 永远不替 Agent 做决策——它只回答 "为什么没过"、"缺什么"、"下一步是谁"。

  迭代习惯:
    AI Coding 容易堆叠代码。不能只往上摞——要时不时停下来思考结构的合理性，
    该重构就重构，该清理就清理，让结构适应新要求同时兼顾老的东西。
    定期打扫卫生是好习惯，在设计和上下文里多琢磨。

  命名规范:
    - 枚举 snake_case, 用户界面中文, 内部字段名/路径英文
    - Capability 前缀: cmd-* = Agent 读的 Markdown 命令 playbook; cli-* = JS 脚本
    - Disposable Bundle: dpt_disp_{prefix}_{name}/ — 实验用临时 bundle, .gitignore 忽略, 测试结束清理

  需求追踪 (Requirement Traceability):
    所有 capability 可追踪，强制性纪律，不可跳过。
    - 唯一登记处: openspec/governance/req-registry.yaml (只增不删，分配前先查)
    - 合规检查: openspec/governance/check-project-reqs.mjs (扫描项目级 main specs 和 active change deltas, 检查重复/未注册/orphan)
    - 每个 capability 分配 3 字母缩写 (首单词前 2 + 次单词首字母), 如 schema-core → SCO
    - 每个 requirement 分配全局唯一 ID: `{PREFIX}-{NNN}`, 如 SCO-001
    - spec 文件开头标注: `> req: XXX-001, XXX-002`
    - Requirement 标题只写稳定语义名，不写 requirement ID；不要写成 `### Requirement: Foo (SCO-001)`
    - 代码实现: `// @impl SCO-001, SCO-002` 注释
    - task 描述: 引用 requirement ID (如 "实现 SCO-001: CurrentGate enum")
    - 每次 change 完成前必须更新 registry 并运行 openspec/governance/check-project-reqs.mjs

  治理工具 (openspec/governance/):
    需求追踪的工具支撑集中在此目录（与 DPT_FRAMEWORK/ 解耦，属于项目级 OpenSpec 治理扩展）:
    - req-registry.yaml        — Requirement ID 唯一登记处（只增不删）
    - check-project-reqs.mjs   — registry 一致性扫描（duplicate / unregistered / orphan / reusedRetired）
    - check-project-specs.mjs  — main spec 结构检查（deltaHeaderInMain / missingPurpose / missingRequirements / missingReqHeader）
    每次 change 归档前两个 check 脚本都必须 PASS，详见下方 rules.tasks。

  测试分层:
    项目有三层测试，按环境和目的区分:

    第一层 — tests/（回归测试）:
      root `tests/` 是项目级回归测试，跑在 `node:test` 下，每次改动后验证无退化。
      `DPT_FRAMEWORK/` 是可发行框架，内部不放测试文件（保持干净可打包）。
      测试目录映射框架目录: tests/engine/ ↔ DPT_FRAMEWORK/engine/。

      包含两类:
        - 单元测试（unit test）: 纯代码，零 I/O。tests/schema/, tests/engine/*.test.mjs, tests/engine/*.test.mjs
        - 集成测试（integration test）: JS+MD 交互，真实文件 I/O，临时目录隔离。tests/integration/

      工具: node:test + node:assert。跑: `node --test tests/engine/ tests/engine/`

    第二层 — experiments_playbook/（受控环境端到端测试）:
      experiments_playbook/exp_{name}/ 下的 Markdown playbook 是 Agent 驱动的受控端到端。
      Agent 逐 step 执行：创建 disposable bundle → import 真实 framework engine →
      执行操作 → 从 trace JSONL 裁决。不 mock——import 真实 engine，在真实 bundle 上
      端到端执行。这是项目当前最接近"生产环境"的测试。

      工具: coding agent + disposable bundle + trace verdict。验证: playbook PASS/FAIL。

    第三层 — 真实环境端到端:
      在生产 run bundle（dpt_rb_*）上由真实 Agent/subagent 执行的端到端测试。
      因环境复杂度和成本暂时搁置，未纳入当前测试策略。待前两层稳定后再规划。

    tests/fixtures/: 最小测试框架（symlink 到 DPT_FRAMEWORK/），为 tests/ 提供 fixture。

  实验体系 (Experiments):
    实验分两层，但关系不是对等——playbook 是驱动层，prototype 是支持环境:

      驱动层 — experiments_playbook/exp_{name}/
        Agent 可读的 Markdown playbook，定义实验要做什么。
        Agent 逐 step 执行：创建 disposable bundle → import 原型 Engine → 执行操作 → 从 trace 裁决。
        这是实验的"入口"——Agent 从这里开始，trace 在这里结束。

      支持环境 — experiments_env/prototype-{name}/
        原型 JS engine + trace 系统 + node MD，为 playbook 提供可 import 的 staging 运行时。
        playbook 不 mock——它 import 真实 engine，在真实 disposable bundle 上端到端执行。
        原型完成后冻结，不随生产代码变化。

      两者通过 AGT-xxx requirement 关联，命名对齐（gate-loop ↔ prototype-gate-loop）。

    驱动层详细约定 — experiments_playbook/:
      目录结构:
        experiments_playbook/
          exp_{component}/                     # 每个实验一个子目录
            test-simple.md                     # 简单场景（核心路径）
            test-medium.md                     # 中等场景（分支 + 修复）
            test-complex.md                    # 复杂场景（全流程 + C&I）
      核心约定:
        - 每个 playbook 创建独立 disposable bundle（dpt_disp_*），互不污染
        - playbook 是 Agent 可读的 Markdown，包含 bash + JS 代码块
        - Step 1 统一用 new-disposable-bundle.mjs 创建 bundle，绝不手动 mkdir/sed
        - 裁决只从 trace JSONL 来，不靠 console output
        - trace event 命名: Engine 事件不带前缀（load_start, file_read, node_exec），
          node MD 自写事件统一用 md: 前缀（md:executed）
        - 3 级复杂度: simple（核心路径）, medium（分支+修复）, complex（全流程+错误路径）

    支持环境详细约定 — experiments_env/:
      目录命名: prototype-{component-name}/（如 prototype-gate-loop）
      标准结构:
        - EXPERIMENT.md              # 实验目的、假设、结论
        - nodes-{component}/         # node MD（*.entry.md = 入口, *.dep.md = 依赖）
      核心约定:
        - 原型仅保留 fixture + 笔记；engine、trace、CLI 代码已搬至 DPT_FRAMEWORK/
        - 完成后冻结，不随生产代码变化

  根目录约定 (Framework ↔ Bundle 同级, 不拷贝):
    docs/                       — 架构文档 (architect/) 与 V12 迁移记录 (v12-migration/)
    experiments_playbook/        — Agent 测试 playbook (见实验体系)
      exp_{component}/            # 每个机制一个子目录
        test-simple.md            # 简单场景（核心路径）
        test-medium.md            # 中等场景（分支 + 修复）
        test-complex.md           # 复杂场景（全流程 + C&I）
    experiments_env/                — 原型实验 (理想化, 冻结, 见实验体系)
    openspec/                   — OpenSpec spec-driven development
      changes/                  — change proposals (deltas) + archive
      config.yaml               — OpenSpec 配置文件（本文件）
      governance/               — 项目级治理扩展（非 OpenSpec 原生），详见 context「治理工具」节
      specs/                    — main specs（capability requirements, source of truth）
    tests/                      — 回归测试 (随代码演进)

    Framework — 唯一共享框架目录:
      DPT_FRAMEWORK/              — reusable framework assets；运行时只读，不保存 run state
        README.md                 — framework runtime guide
        COMMANDS.md               — 命令索引
        cli/                      — 当前 framework-level CLI，如 instantiate/validate/inspect/operate queue
        command_playbook/         — Agent/operator 可读命令说明
        engine/                   — deterministic engine code 与 trace utility
        schema/                   — Zod enums、index、contracts/{gate,plan,profile,queue,status,trace}.mjs
        rb_templates/             — 实例化 run bundle 的初始模板
        workflows/                — workflow-foundation target；v1 单主 workflow，不是多 workflow namespace

    Bundle — 可多个、彼此隔离的运行时目录:
      dpt_rb_{name}/              — production Runtime Bundle，通过 ../DPT_FRAMEWORK/ 引用同一套 framework
        START_FROM_HERE.md        — 启动入口
        rb_plan.md                — 话题设计 (Markdown + JSON frontmatter)
        rb_profile.yaml           — 用户意图 / HITL profile
        rb_status.json            — phase/gate 状态摘要
        rb_queue.json             — 执行队列
        rb_trace.jsonl            — append-only 诊断日志
        seed_topics/              — 种子话题文件
        reference/                — 本地证据
        artifacts/                — 阶段产物，如 wave1/、wave2/
        final/                    — 最终报告
        _cache/                   — 可重建缓存/projection，不是 authority

rules:
  proposal:
    - 用中文写 proposal，明确这个 change 产出什么、不产出什么
    - 引用 V12 原始需求时注明来源文件
    - 为新 capability 分配 3 字母缩写并提前登记到 openspec/governance/req-registry.yaml (先查历史，避免冲突，别随意发挥)
  design:
    - "数据结构用 Zod schema 定义（`.refine()` 做跨字段校验）"
    - 状态机用显式转换表 (Map/object)，不允许隐藏在 prose 里
    - 跨文件引用必须明确 Source of Record
    - "只用批准的依赖: zod, yaml。其余一律 Node.js 标准库"
  tasks:
    - 每个 task 有明确 done condition，可独立验证
    - 按依赖排序，优先搭骨架再填功能
    - 单个 task 不超过 2 小时
    - "Task 描述中引用它实现的 requirement ID (如 \"实现 SCO-001: CurrentGate enum\")"
    - |
      每个 change 的 tasks 必含两条收尾检查 task, 归档前硬性 done condition:
        1. 运行 `node openspec/governance/check-project-reqs.mjs` 必须 PASS
           (0 duplicate / 0 orphan / 0 unregistered / 0 reusedRetired)
        2. 运行 `node openspec/governance/check-project-specs.mjs` 必须 PASS
           (0 deltaHeaderInMain / 0 missingPurpose / 0 missingRequirements / 0 missingReqHeader)
      收尾检查固化进每个 change 生命周期——防止 requirement ID 堆叠/漏标/被覆盖，
      以及 delta 格式污染 OpenSpec main spec 而无人发现。
  specs:
    - Capability 用 kebab-case 命名，目录名即分类
    - Spec 文件是 Zod schema 的人类可读投影
    - |
      OpenSpec main spec (`openspec/specs/<capability>/spec.md`):
      必须有 `## Purpose` + `## Requirements`。
      Delta 头 (`## ADDED|MODIFIED|REMOVED|RENAMED Requirements`) 只在
      `openspec/changes/<name>/specs/<capability>/spec.md` 合法 ——
      由 `openspec/governance/check-project-specs.mjs` 强制执行。
    - |
      每个 main spec 文件必须有 `> req: XXX-001` 行标注涉及的 requirement ID
      (项目级追踪约定, 非 OpenSpec 原生字段)
    - |
      Requirement 标题必须是稳定语义锚点，不得包含 registry ID、括号 ID 或编号前缀。
      正确: `### Requirement: Structured queue state validates task cards`
      错误: `### Requirement: Structured queue state validates task cards (AGQ-001)`
      Requirement ID 只放在 `> req:` 头、`openspec/governance/req-registry.yaml`、
      tasks 的 `@impl <REQ-ID>`、代码注释 `// @impl <REQ-ID>` 或 MD frontmatter `req:`。
    - 列出该 capability 涉及的 requirement ID 和 invariant ID
    - 实现代码中用 `// @impl <REQ-ID>` 标注, MD 文件用 frontmatter `req:` 标注
