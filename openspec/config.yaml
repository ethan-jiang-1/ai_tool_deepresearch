schema: spec-driven

context: |
  Deep Research Tool — 将宽泛研究问题转化为证据支撑、多波次、带门控的研究报告。

  项目定位:
    这是一个 agentic framework。目录即约定，不依赖额外配置文件。
    Agent (LLM) 是执行者 (搜索、阅读、写作、综合、决策)，
    Engine (JavaScript) 是校验者 (Schema 验证、Gate 审计、Receipt 检查)，
    Markdown/JSON/YAML 文件是持久化状态。

  核心原则:
    - Engine (JavaScript) 强制执行规则 (schemas, state machines, receipts)
    - Agent (LLM) 生产内容 (搜索、阅读、写作、综合)
    - Markdown 控制 Agent Flow，JS/CLI 控制确定性 checkpoint
    - JS/CLI 的输出 (check/inspect/advice) 必须回到 conversation context，让 MD 读后继续行动
    - JS/CLI 不编排多阶段流程、不做语义判断、不替 Agent 选修复策略
    - Gate 不持有路由——Transition table 负责 Node 间转移，Gate 只问不猜
    - 禁止用环境变量传递跨 tool-call 的实验/runtime state——Coding Agent 每个 tool call 是独立 shell。
      这不禁止 Agent CLI Launcher 在自己拥有的 child env 中携带 host provider 凭据与路由；
      case context、bundle role 和 verdict authority 仍必须通过显式文件、CLI flag 或函数参数传递

  技术栈:
    Node.js ≥20, 纯 JavaScript (ESM, .mjs)。不使用 TypeScript。
    仅 2 个批准的 npm 依赖 (不可新增): zod (schema 校验), yaml (YAML 文件解析)。
    其余全部 Node.js 内置: node:util.parseArgs, node:fs/promises, node:test + node:assert, node:path。
    状态机: 显式转换表 (Map/object), 不用 XState。
    Markdown frontmatter: 正则提取 + JSON.parse(), 不用 gray-matter。

  LLM-JS 协作原则 (Check & Inspect):
    长程 Agent 任务中 LLM 易受噪声干扰产生幻觉。
    采用 C (Check 硬性验证) + I (Inspect 审视诊断) 双保险:
    - Check: JavaScript/Zod 在写入前校验 Schema、不变量、Receipt — 不通过则拒绝写入
    - Inspect: CLI 诊断工具事后审视 Gate 审计、交叉引用、证据质量 — 发现问题反馈给 LLM 反思纠正
    LLM 负责信息加工，JS 负责质量保证。验证失败 → 反馈 → 反思 → 纠正，不静默通过。

    JS/MD 边界判断:
      遇到"这段逻辑该放 JS 还是 MD"拿不准时，读 guidelines/project-charter.md 的
      "Operating Model" 节和 guidelines/framework-runtime-boundary.md 的
      "Agent-Engine Communication" 节。速判口诀：
        MD/Agent 侧：多阶段流程编排、修复策略选择、语义判断、branch 路由决策
        JS/Engine 侧：schema 校验、状态转移查询 (askNext)、receipt 检查、trace 写入
      Engine 提供注入点（函数参数），MD/Agent 提供实际逻辑。
      Engine 永远不替 Agent 做决策——它只回答 "为什么没过"、"缺什么"、"下一步是谁"。

  迭代习惯:
    AI Coding 容易堆叠代码。不能只往上摞——要时不时停下来思考结构的合理性，
    该重构就重构，该清理就清理，让结构适应新要求同时兼顾老的东西。
    定期打扫卫生是好习惯，在设计和上下文里多琢磨。

  Evolution Directions（proposal/design 必须按当前顺序 review）:
    - guidelines/evolution-abstraction-semantic-precision.md：在新增或实质改变具名 state、projection、status、concept、Module、command 或 reader-facing view 前，
      留下一小段连贯的语义反思：它服务哪个明确读者的哪个有界问题、哪些区别必须保留、以及读者如何能在此层得出精确结论或明确 unknown，
      而不必沿正常路径回到底层重建。不要把这变成固定表格或 Engine verdict。
    - guidelines/evolution-simple-reliable-control.md：在语义层已说明后，优先 direct Source of Record 和最短合法闭环；
      新增 state/check/validator/fallback/retry/recovery 必须说明净简化（net simplification），以及删除、合并或避免了什么复杂度，
      不得仅以“更可靠”为由继续堆叠控制层。
    - guidelines/evolution-helper-oriented-agent.md：在语义层与控制形状均已说明后，用户负责新的语义、风险与权限决定；
      Agent 负责已授权的机械执行与可逆修复；Engine 负责确定性 verdict。
      human-directed 只说明决定来源，不创造 permission、override 或缺失 runtime capability。

  命名规范:
    - 枚举 snake_case, 用户界面中文, 内部字段名/路径英文
    - Capability 前缀: cmd-* = Agent 读的 Markdown 命令 playbook; cli-* = JS 脚本
    - Disposable Bundle: dpt_disp_{prefix}_{name}/ — case run root 内的实验 bundle；是否清理由 Supervisor outcome/health/audit policy 决定

  需求追踪 (Requirement Traceability):
    所有 capability 可追踪，强制性纪律，不可跳过。
    - 唯一登记处: openspec/governance/req-registry.yaml (只增不删，分配前先查)
    - 合规检查: openspec/governance/check-project-reqs.mjs (扫描项目级 main specs 和 active change deltas, 检查重复/未注册/orphan)
    - 每个 capability 分配 3 字母缩写 (首单词前 2 + 次单词首字母), 如 schema-core → SCO
    - 每个 requirement 分配全局唯一 ID: `{PREFIX}-{NNN}`, 如 SCO-001
    - spec 文件开头标注: `> req: XXX-001, XXX-002`
    - Requirement 标题只写稳定语义名，不写 requirement ID；不要写成 `### Requirement: Foo (SCO-001)`
    - 代码实现: `// @impl SCO-001, SCO-002` 注释
    - task 描述: 引用 requirement ID (如 "实现 SCO-001: CurrentGate enum")
    - 每次 change 完成前必须更新 registry 并运行 openspec/governance/check-project-reqs.mjs

  治理工具 (openspec/governance/):
    需求追踪的工具支撑集中在此目录（与 DEEP_RESEARCH_HARNESS/ 解耦，属于项目级 OpenSpec 治理扩展）:
    - req-registry.yaml        — Requirement ID 唯一登记处（只增不删）
    - check-project-reqs.mjs   — registry 一致性扫描（duplicate / unregistered / orphan / reusedRetired）
    - check-project-specs.mjs  — main spec 结构检查（deltaHeaderInMain / missingPurpose / missingRequirements / missingReqHeader）
    每次 change 归档前两个 check 脚本都必须 PASS，详见下方 rules.tasks。

    Registry 组织约定（强制性，所有 change 遵守）:
    - `# <capability-name>` 组头与 `openspec/specs/<capability-name>/` 目录一一对应——不存在合成组头（将多个 capability 归入人造标题）
    - `prefixes:` 映射块是缩写→capability 全称的唯一自文档化来源（位于 req-registry.yaml 头部注释后、第一个 ID 组之前）
    - ID 按 capability 分组，组按字母序排列，组内 ID 按数字序排列
    - Delta 段（如 `# schema-core (delta)`）不允许——新增 ID SHALL 直接归入对应 capability 组，不另开 delta 组头
    - 废弃 ID SHALL 保留在原 capability 组内数字序的正常位置，值末尾标注 `[DEPRECATED]`；整个 capability 废弃时组头标 `— all entries deprecated; no spec directory`，放在文件末尾

  Verification routing:
    项目使用 exactly four canonical `test_class` identifiers。完整分类与 proof permission 由 accepted
    `verification-routing` spec 定义；本文件只拥有 change lifecycle 与 asset placement 规则。
    - `unit`: focused JS-led `node:test` under `tests/`, outside `tests/integration/` and `tests/e2e/`
    - `integration`: JS-led boundary tests under `tests/integration/`
    - `deterministic_e2e`: JS-led workflow-scale deterministic chains under `tests/e2e/`
    - `agent_flow_e2e`: Headless/Interactive Playbook Agent 执行 `experiments_playbook/` Markdown，使用真实 disposable runtime
    `regression`, cost, actor, judge, fixture distance, and runtime bundle type are not peer test classes.
    Autorun Supervisor 与 Agent CLI Launcher 是 host/lifecycle surface，不是新的 test class 或 proof subject。
    普通 CI/`node:test` fixture 只能证明 deterministic Supervisor mechanics；只有 CI 显式提供真实 Agent CLI、
    model credentials 和所需 tools 时，才可作为 host 发起 `agent_flow_e2e`，native runtime evidence 仍是 authority。
    New changes SHALL create change-root `verification-plan.yaml`; apply tasks SHALL run
    `check-verification-routing.mjs --mode plan` before target edits and `--mode assets` before archive.
    This is repo lifecycle discipline, not an OpenSpec-native artifact gate: `openspec status/validate`
    does not parse or validate the custom plan.

    tests/fixtures/: 最小测试框架（symlink 到 DEEP_RESEARCH_HARNESS/），为 tests/ 提供 fixture。

  实验体系 (Experiments):
    正典术语与责任边界见 `guidelines/command-experiments.md`；当前操作入口见
    `experiments_playbook/README.md` 与 `DEEP_RESEARCH_HARNESS/host_tools/README.md`。本文件只保留高频路由:
    - Agent Experiment Autorun 是正常 unattended launch model，不是传统 CLI test runner。
    - Autorun Supervisor 选择、启动、监督、验证 native completion、运行 health、审计和清理；不执行 Markdown 或重判 verdict。
    - Agent CLI Launcher 只启动 Coding Agent runtime。
    - Headless/Interactive Playbook Agent 执行完整 Markdown；Interactive 仅用于单 case 诊断、replay 或真人 judgment。
    - Subject Agent/Sub-agent 是 case-owned 独立智能 actor；Playbook Agent 参与不能冒充 Subject evidence。
    - Headless chain: host → Autorun Supervisor → Agent CLI Launcher → Headless Playbook Agent → Markdown/Engine → native completion → Supervisor health/audit/report/cleanup。
      Interactive chain 使用同一 contract，但以 Interactive Playbook Agent 执行单 case 并保留 run root。
    - Engine/CLI 拥有 deterministic checkpoint、receipt、trace 与 native completion contract。
    - `PLAYBOOK_MANIFEST.md` 只拥有 active path/order；V2 frontmatter 拥有 case policy；filename 拥有 cost；native completion 是唯一 case outcome authority。
    - Current surfaces: `experiments_playbook/PLAYBOOK_MANIFEST.md`、`RUN_AGENT_AUTORUN_EXPS.md`、`RUN_INTERACTIVE_EXPS.md` 与
      `DEEP_RESEARCH_HARNESS/host_tools/run-agent-experiment.mjs`; detailed behavior remains in accepted specs and executable contracts.
    - 每个 case 使用显式 Supervisor-owned run root；`.exp-bundles/` 只含 run-owned state/log/evidence/audit/report，
      不复制或链接 repo-root `DEEP_RESEARCH_HARNESS/`、`experiments_env/`、`tests/`。
    - native outcome、host lifecycle、Agent process、health 与 cleanup 分离；playbook finalization 后停止，health/cleanup 由 Supervisor 负责。
    - `experiments_env/shared/` 只提供薄 setup/fact helper；不得成为隐藏 Playbook Agent、第二 verdict 或 cleanup owner。

  根目录约定 (Framework ↔ Bundle 同级, 不拷贝):
    docs/                       — 架构文档 (architect/)
    experiments_playbook/        — Agent 测试 playbook (见实验体系)
      exp_{component}/            # 每个机制一个子目录；命名与格式详见 guidelines/command-experiments.md
    experiments_env/                — 原型实验 (理想化, 冻结, 见实验体系)
    openspec/                   — OpenSpec spec-driven development
      changes/                  — change proposals (deltas) + archive
      config.yaml               — OpenSpec 配置文件（本文件）
      governance/               — 项目级治理扩展（非 OpenSpec 原生），详见 context「治理工具」节
      specs/                    — main specs（capability requirements, source of truth）
    tests/                      — 回归测试 (随代码演进)

    Framework — 唯一共享框架目录:
      DEEP_RESEARCH_HARNESS/              — reusable framework assets；运行时只读，不保存 run state
        README.md                 — framework runtime guide
        COMMANDS.md               — 命令索引
        cli/                      — 当前 framework-level CLI，如 instantiate/validate/inspect/operate queue
        command_playbook/         — Agent/operator 可读命令说明
        engine/                   — deterministic engine code 与 trace utility
        schema/                   — Zod enums、index、contracts/{gate,plan,profile,queue,status,trace}.mjs
        rb_templates/             — 实例化 run bundle 的初始模板
        workflows/                — workflow-foundation target；v1 单主 workflow，不是多 workflow namespace

    Bundle — 可多个、彼此隔离的运行时目录:
      dpt_rb_{name}/              — production Runtime Bundle，通过 ../DEEP_RESEARCH_HARNESS/ 引用同一套 framework
        BUNDLE_MAP.md            — passive bundle map
        rb_plan.md                — 话题设计 (Markdown + JSON frontmatter)
        rb_profile.yaml           — 用户意图 / HITL profile
        rb_status.json            — phase/gate 状态摘要
        rb_queue.json             — 执行队列
        rb_trace.jsonl            — append-only 诊断日志
        seed_topics/              — 种子话题文件
        reference/                — 本地证据
        artifacts/                — 阶段产物，如 wave1/、wave2/
        final/                    — 最终报告
        _cache/                   — 可重建缓存/projection，不是 authority

operations:
  apply:
    guidance:
      - >-
        change-feedback-loop/apply: For a feedback-lifecycle change, complete the durable
        openspec-feedback:plan-review before the first target edit. Read
        guidelines/change-feedback-loop.md, preserve any pending feedback task, and convert an
        actionable finding into an ordinary unchecked task. This guidance is not proof of review
        completion or a deterministic verdict.
  archive:
    guidance:
      - >-
        change-feedback-loop/archive: For a feedback-lifecycle change, review the selected
        change-scoped actual diff, artifacts, and selected verification evidence; leave a
        finding as an ordinary unchecked task and keep openspec-feedback:closeout-review open.
        After Agent-owned delta/main sync and re-comparison when applicable, complete all tasks
        and use node openspec/governance/finalize-change-archive.mjs --change <name> as the only
        supported final mechanical transition. Guidance is not archive permission.

rules:
  proposal:
    - 用中文写 proposal，明确这个 change 产出什么、不产出什么
    - 引用原始需求时注明来源文件
    - 为新 capability 分配 3 字母缩写并提前登记到 openspec/governance/req-registry.yaml (先查历史，避免冲突，别随意发挥)
    - 说明 direct Source of Record、最短合法闭环与 net simplification impact，明确删除、合并或避免的 control complexity
    - 对新增或实质改变的具名 state、projection、status、concept、Module、command 或 reader-facing view，先写简短的 semantic-precision reflection：明确读者/有界问题、必须保留的区别与正常推理停止点（或明确 unknown）
    - 说明 user decision / Agent execution / Engine verdict 的责任边界，不得用 human-directed 创造 permission 或 capability
    - |
      修改 `DEEP_RESEARCH_HARNESS/` 行为的 change 必须在 proposal 中声明是否需要 version bump；
      需要时声明 target version（如 `v0.2`），作为 implementation 阶段 CHANGELOG 和 RUN.md banner 更新的依据。
  design:
    - "数据结构用 Zod schema 定义（`.refine()` 做跨字段校验）"
    - 状态机用显式转换表 (Map/object)，不允许隐藏在 prose 里
    - 跨文件引用必须明确 Source of Record
    - "只用批准的依赖: zod, yaml。其余一律 Node.js 标准库"
    - >
      architecture、recovery、mutation、Agent/user responsibility 或具名概念/状态/view 变更，
      必须按顺序考虑 semantic precision → simple reliable control → helper-oriented responsibility。
      对实际新增或实质改变的层，阅读并应用
      guidelines/evolution-abstraction-semantic-precision.md、
      guidelines/evolution-simple-reliable-control.md、
      guidelines/evolution-helper-oriented-agent.md；在 design.md 的相应设计论证中简短记录
      语义边界、direct Source of Record / 最短合法闭环 / net simplification，以及
      user decision / authorized Agent execution / Engine verdict 的边界。未改变的层可说明不适用。
  tasks:
    - 每个 task 有明确 done condition，可独立验证
    - 按依赖排序，优先搭骨架再填功能
    - 单个 task 不超过 2 小时
    - "Task 描述中引用它实现的 requirement ID (如 \"实现 SCO-001: CurrentGate enum\")"
    - |
      每个 change 的 tasks 必含两条收尾检查 task, 归档前硬性 done condition:
        1. 运行 `node openspec/governance/check-project-reqs.mjs` 必须 PASS
           (0 duplicate / 0 orphan / 0 unregistered / 0 reusedRetired)
        2. 运行 `node openspec/governance/check-project-specs.mjs` 必须 PASS
           (0 deltaHeaderInMain / 0 missingPurpose / 0 missingRequirements / 0 missingReqHeader)
      收尾检查固化进每个 change 生命周期——防止 requirement ID 堆叠/漏标/被覆盖，
      以及 delta 格式污染 OpenSpec main spec 而无人发现。
    - |
      修改 `DEEP_RESEARCH_HARNESS/` 行为且 proposal 声明了 version bump 的 change，
      其 tasks 必须包含两步：(a) 更新 `CHANGELOG.md`（简洁格式：版本号 + 一两句说清改了什么）；
      (b) 同步 `DEEP_RESEARCH_HARNESS/RUN.md` 版本横幅与 CHANGELOG 最新条目一致。
    - |
      使用 feedback lifecycle 的 change 必须在 tasks.md 中生成两个 first-class checkbox task：
      一个先于首次 target edit 的 plan review，任务行恰含 `openspec-feedback:plan-review`；
      一个 archive-precondition closeout review，任务行恰含 `openspec-feedback:closeout-review`。
      每个 marker 恰好一次，初始为 `- [ ]`，并且只在相应 review 完成时勾选。review finding 不能只留在
      chat 或 marker：它必须成为普通未完成 task，列出受影响 requirement/reader question、authoritative
      owner、smallest repair 与 independently observable done condition。marker 不证明 semantic quality、
      test success、delta/main equivalence 或 archive completion。
  specs:
    - Capability 用 kebab-case 命名，目录名即分类
    - Spec 文件是 Zod schema 的人类可读投影
    - |
      OpenSpec main spec (`openspec/specs/<capability>/spec.md`):
      必须有 `## Purpose` + `## Requirements`。
      Delta 头 (`## ADDED|MODIFIED|REMOVED|RENAMED Requirements`) 只在
      `openspec/changes/<name>/specs/<capability>/spec.md` 合法 ——
      由 `openspec/governance/check-project-specs.mjs` 强制执行。
    - |
      每个 main spec 文件必须有 `> req: XXX-001` 行标注涉及的 requirement ID
      (项目级追踪约定, 非 OpenSpec 原生字段)
    - |
      Requirement 标题必须是稳定语义锚点，不得包含 registry ID、括号 ID 或编号前缀。
      正确: `### Requirement: Structured queue state validates task cards`
      错误: `### Requirement: Structured queue state validates task cards (AGQ-001)`
      Requirement ID 只放在 `> req:` 头、`openspec/governance/req-registry.yaml`、
      tasks 的 `@impl <REQ-ID>`、代码注释 `// @impl <REQ-ID>` 或 MD frontmatter `req:`。
    - 列出该 capability 涉及的 requirement ID 和 invariant ID
    - 实现代码中用 `// @impl <REQ-ID>` 标注, MD 文件用 frontmatter `req:` 标注
    - |
      Capability 边界测试（新增 capability 时 SHALL 通过以下检查。满足任一条件则应为独立 capability，建独立 spec）:
        1. 约束条件不同 — 行为契约的约束条件与其他 capability 正交（如 `hitl-ux` 约束 "用户在场时的对话"，`silent-wave-execution` 约束 "用户缺席时的自律"）
        2. 独立 requires 链 — 被不同的 phase node 以独立的 `requires` 链加载
        3. 独立 gate 检查 — 有独立的 gate 检查，或 gate rule 的 target 语义与现有 capability 不重叠
        4. 不同 Engine 模块 — 涉及不同的 schema contract、CLI、或 trace event 族
      SHALL NOT 以主题标签（如 "UX 相关"、"性能相关"）作为 capability 边界——主题标签描述关注领域，不描述行为契约的约束条件。
