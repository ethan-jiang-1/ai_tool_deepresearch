schema: spec-driven

context: |
  Deep Research Tool turns broad questions into evidence-backed, multi-wave,
  gated research reports. It is an agentic framework: Agent judgment and
  Markdown Agent Flow remain distinct from Engine-owned deterministic facts.

  Authority boundary:
    - Agent: research, writing, semantic judgment, and authorized repair.
    - Markdown: Agent-readable flow, constraints, and feedback context.
    - Engine/JS: schemas, deterministic transitions, receipts, trace, and
      check/inspect/advice verdicts; it does not orchestrate semantic work.
    - Current runtime truth: the explicitly selected current run bundle, never
      chat memory or reusable framework assets.
    - Accepted behavior: the applicable accepted OpenSpec spec and executable
      contract. Guidance routes work; it does not override those owners.

  Required design review order:
    - openspec/constitution/evolution/abstraction-semantic-precision.md:
      establish the reader's bounded question, essential distinctions, and a
      normal reasoning stop before naming a new concept/state/view.
    - openspec/constitution/evolution/simple-reliable-control.md:
      prefer a direct Source of Record and shortest legal loop; describe net
      simplification before adding a check, state, fallback, retry, or recovery.
    - openspec/constitution/evolution/helper-oriented-agent.md:
      keep semantic/risk/permission decisions with the user, ordinary legal
      mechanical work with the Agent, and deterministic verdicts with the Engine.

  Read the smallest owner for the task:
    - openspec/constitution/project-charter.md: universal project boundary.
    - CONTEXT.md: concise vocabulary alignment.
    - openspec/README.md: demand-driven role router.
    - openspec/guidance/models/: complete system-understanding terminology.
    - openspec/operations/: current Agent-facing procedures.
    - openspec/specs/: accepted capability behavior.
    - selected current run bundle: current runtime fact.

  Engineering constraints:
    Node.js >=20, pure ESM JavaScript, no TypeScript, and no dependencies beyond
    zod and yaml. Use node:test + node:assert for JS-led tests. Do not fabricate
    trace, receipts, runtime results, or completion claims.

  Requirement and verification routes:
    The requirement registry and its governance checks own requirement identity.
    The accepted `verification-routing` spec owns proof permission and exactly
    four test classes: `unit`, `integration`, `deterministic_e2e`, and
    `agent_flow_e2e`. A change-root verification plan selects evidence; it is not
    an OpenSpec-native artifact gate.

  Experiment route:
    Agent Experiment Autorun is the unattended launch model. The Autorun Supervisor owns host lifecycle, health, audit, and cleanup; the Agent CLI
    Launcher starts the coding-agent runtime; Playbook Agents execute Markdown;
    Engine/CLI owns deterministic checkpoints and native completion facts.
    普通 CI/`node:test` fixture 只能证明 deterministic Supervisor mechanics；只有 CI 显式提供真实
    Agent CLI、model credentials 和所需 tools 时，才可作为 host 发起 `agent_flow_e2e`，native
    runtime evidence 仍是 authority。详细术语和程序由
    openspec/operations/command-experiments.md 与 selected accepted/executable
    contracts 拥有。

operations:
  apply:
    guidance:
      - >-
        change-feedback-loop/apply: For a feedback-lifecycle change, complete the durable
        openspec-feedback:plan-review before the first target edit. Read
        openspec/operations/change-feedback-loop.md, preserve any pending feedback task, and convert an
        actionable finding into an ordinary unchecked task. For an affected semantic-closure
        record, use a `#fragment` only for an actual symbol or document anchor; otherwise use a
        bare file coordinate with existing prose. Classify `consumers` as verdict consumers only
        and an Agent-facing projection as `overlap: derived`. The structural checker does not
        validate fragment/role semantics. This guidance is not proof of review completion or a
        deterministic verdict.
      - >-
        requirement-reservation/apply: Before the first target edit, run
        node openspec/governance/check-project-reqs.mjs --mode plan. A change whose delta adds a
        New capability must own a valid same-change requirement-reservation.yaml. A passing plan
        check is not target-edit or archive permission. Only during Apply, after the canonical main
        spec exists through approved work, synchronize its live prefix and requirement IDs into
        req-registry.yaml; the governed finalizer supplies selected archive scope.
      - >-
        semantic-fact-closure/apply: Before every first target edit, run
        node openspec/governance/check-verification-routing.mjs --change <name> --mode plan and then
        node openspec/governance/check-semantic-closure.mjs --change <name> --mode plan. A
        feedback-lifecycle change runs both after its durable plan review. A missing or non-zero
        semantic-closure check stops Apply at the reported repair coordinate and the same rerun
        command; it has no missing-command fallback. Passing structure does not prove semantic
        completeness or grant archive permission.
      - >-
        doc-locks-preflight/apply: 若本 change 修改任何 governed document
        （entry docs、COMMANDS.md、specs 等），在首次 target edit 前运行
        node scripts/list-doc-locks.mjs <repo-relative-doc-path> 盘点受影响
        锁，受影响断言在同一 change 内更新。本 guidance 不是审查完成或归档
        许可。
  archive:
    guidance:
      - >-
        change-feedback-loop/archive: For a feedback-lifecycle change, review the selected
        change-scoped actual diff, artifacts, and selected verification evidence; leave a
        finding as an ordinary unchecked task and keep openspec-feedback:closeout-review open.
        For an affected semantic-closure record, use a `#fragment` only for an actual symbol or
        document anchor; otherwise use a bare file coordinate with existing prose. Classify
        `consumers` as verdict consumers only and an Agent-facing projection as `overlap: derived`.
        The structural checker does not validate fragment/role semantics. Read
        openspec/operations/change-feedback-loop.md for the full closeout rubric.
        After Agent-owned delta/main sync and re-comparison when applicable, complete all tasks
        and use node openspec/governance/finalize-change-archive.mjs --change <name> as the only
        supported final mechanical transition. Guidance is not archive permission.

rules:
  proposal:
    - 用中文写 proposal，明确这个 change 产出什么、不产出什么
    - 引用原始需求时注明来源文件
    - |
      在声明 New 或 Modified capability 前，先读 `openspec/specs/README.md`（或取得
      `openspec list --specs --json`）并检查相关 main spec。proposal.md 必须有
      `## Capability Discovery` 表，列出完整 `domain/capability` candidate path、
      Evidence read、Modify|Verify-only|Excluded|New decision 与 reason；New 必须说明
      没有已检查 contract 拥有该 observable behavior。`skip_specs: true` 仍须明确
      delta-spec 不适用的原因。Catalog 只用于导航，main spec 仍是 behavior authority。
    - |
      对 New capability，先检查 live `openspec/governance/req-registry.yaml` 与所有 active
      change 根目录的 `requirement-reservation.yaml`，确认完整 capability path、3 字母 prefix
      和 requirement ID 都不冲突。在生成该 capability 的 delta 时，必须在同一 change 根目录创建
      严格的 `requirement-reservation.yaml`，并在对应 `> req:` header 就绪后运行
      `node openspec/governance/check-project-reqs.mjs --mode plan`。proposal/explore 不得预登记
      live prefix 或新 capability ID，也不得创建 canonical main spec；这些 live facts 仅可在 Apply
      创建 canonical main spec 后同步到 registry。
    - |
      在 planning artifacts 完整之前，读取
      `openspec/governance/semantic-fact-families.yaml` 作为唯一可用的 deterministic fact
      family vocabulary，并在 change 根目录创建严格的 `semantic-closure.yaml`。选择其一，但
      不要由本规则替 Agent 决定：
      `not_applicable` starter 为
      `schema_version: semantic-closure/v1`, `change: <change>`,
      `status: not_applicable`, `reason: <non-empty reason>`；`affected` starter 为
      `schema_version: semantic-closure/v1`, `change: <change>`, `status: affected`,
      `catalog_additions: []`, `affected: [<one entry per family>]`。若需要尚未 cataloged 的
      family，在同一 record 的 `catalog_additions` 声明精确 ID/question，并在第一个依赖该
      family 的 target edit 前将它写入 global catalog。缺少或 malformed record 的唯一
      repair boundary 是 target edit 前的
      `node openspec/governance/check-semantic-closure.mjs --change <change> --mode plan`；
      该指导不是 semantic verdict。repository-relative base file 是 machine-checked coordinate
      identity；可选 `#fragment` 只是 human-facing navigation hint，只有 author 能在所述 revision
      中识别 actual symbol or document anchor 时才可使用。无法稳定命名或 identity unknown 时，使用
      bare file coordinate，并在 `fact`、`overlap[].detail`、design 或 review evidence 的 existing
      prose 中说明 surface，不能猜测 fragment 来制造 false precision。roles 必须相对于 family
      conclusion 分类：`consumers` 只放 verdict consumers；仅展示 resolved contract 的 Agent-facing
      task、schema、starter 或 prompt 使用适用的 `overlap: derived`，不能因读取或展示事实而成为
      consumer。structural checker does not validate fragment/role semantics；fragment truth 与 role
      classification 仍由 plan/closeout review 负责。
    - 说明 direct Source of Record、最短合法闭环与 net simplification impact，明确删除、合并或避免的 control complexity
    - 对新增或实质改变的具名 state、projection、status、concept、Module、command 或 reader-facing view，先写简短的 semantic-precision reflection：明确读者/有界问题、必须保留的区别与正常推理停止点（或明确 unknown）
    - 说明 user decision / Agent execution / Engine verdict 的责任边界，不得用 human-directed 创造 permission 或 capability
  design:
    - "数据结构用 Zod schema 定义（`.refine()` 做跨字段校验）"
    - 状态机用显式转换表 (Map/object)，不允许隐藏在 prose 里
    - 跨文件引用必须明确 Source of Record
    - "只用批准的依赖: zod, yaml。其余一律 Node.js 标准库"
    - >
      architecture、recovery、mutation、Agent/user responsibility 或具名概念/状态/view 变更，
      必须按顺序考虑 semantic precision → simple reliable control → helper-oriented responsibility。
      对实际新增或实质改变的层，阅读并应用
      openspec/constitution/evolution/abstraction-semantic-precision.md、
      openspec/constitution/evolution/simple-reliable-control.md、
      openspec/constitution/evolution/helper-oriented-agent.md；在 design.md 的相应设计论证中简短记录
      语义边界、direct Source of Record / 最短合法闭环 / net simplification，以及
      user decision / authorized Agent execution / Engine verdict 的边界。未改变的层可说明不适用。
  tasks:
    - 每个 task 有明确 done condition，可独立验证
    - 按依赖排序，优先搭骨架再填功能
    - 单个 task 不超过 2 小时
    - "Task 描述中引用它实现的 requirement ID (如 \"实现 SCO-001: CurrentGate enum\")"
    - |
      每个 change 的 tasks 必含两条收尾检查 task, 归档前硬性 done condition:
        1. 运行 `node openspec/governance/check-project-reqs.mjs --mode archive --change <change>`
           必须 PASS (0 duplicate / 0 orphan / 0 unregistered / 0 reusedRetired，且 selected
           reservation 已 transition 为 live identity)
        2. 运行 `node openspec/governance/check-project-specs.mjs` 必须 PASS
           (0 deltaHeaderInMain / 0 missingPurpose / 0 missingRequirements / 0 missingReqHeader)
      收尾检查固化进每个 change 生命周期——防止 requirement ID 堆叠/漏标/被覆盖，
      以及 delta 格式污染 OpenSpec main spec 而无人发现。
    - |
      使用 feedback lifecycle 的 change 必须在 tasks.md 中生成两个 first-class checkbox task：
      一个先于首次 target edit 的 plan review，任务行恰含 `openspec-feedback:plan-review`；
      一个 archive-precondition closeout review，任务行恰含 `openspec-feedback:closeout-review`。
      每个 marker 恰好一次，初始为 `- [ ]`，并且只在相应 review 完成时勾选。review finding 不能只留在
      chat 或 marker：它必须成为普通未完成 task，列出受影响 requirement/reader question、authoritative
      owner、smallest repair 与 independently observable done condition。marker 不证明 semantic quality、
      test success、delta/main equivalence 或 archive completion。
  specs:
    - Capability identity 用完整 `domain/capability`（两段均为 kebab-case）；leaf name 不是 live identity，approved domain 由 catalog/governance 约束
    - Spec 文件是 Zod schema 的人类可读投影
    - |
      OpenSpec main spec (`openspec/specs/<domain>/<capability>/spec.md`):
      必须有 `## Purpose` + `## Requirements`。
      Delta 头 (`## ADDED|MODIFIED|REMOVED|RENAMED Requirements`) 只在
      `openspec/changes/<name>/specs/<domain>/<capability>/spec.md` 合法 ——
      由 `openspec/governance/check-project-specs.mjs` 强制执行。
    - |
      每个 main spec 文件必须有 `> req: XXX-001` 行标注涉及的 requirement ID
      (项目级追踪约定, 非 OpenSpec 原生字段)
    - |
      Requirement 标题必须是稳定语义锚点，不得包含 registry ID、括号 ID 或编号前缀。
      正确: `### Requirement: Structured queue state validates task cards`
      错误: `### Requirement: Structured queue state validates task cards (AGQ-001)`
      Requirement ID 只放在 `> req:` 头、`openspec/governance/req-registry.yaml`、
      tasks 的 `@impl <REQ-ID>`、代码注释 `// @impl <REQ-ID>` 或 MD frontmatter `req:`。
    - 列出该 capability 涉及的 requirement ID 和 invariant ID
    - 实现代码中用 `// @impl <REQ-ID>` 标注, MD 文件用 frontmatter `req:` 标注
    - |
      Capability 边界测试（新增 capability 时 SHALL 通过以下检查。满足任一条件则应为独立 capability，建独立 spec）:
        1. 约束条件不同 — 行为契约的约束条件与其他 capability 正交（如 `agent/hitl-ux` 约束 "用户在场时的对话"，`workflow/silent-wave-execution` 约束 "用户缺席时的自律"）
        2. 独立 requires 链 — 被不同的 phase node 以独立的 `requires` 链加载
        3. 独立 gate 检查 — 有独立的 gate 检查，或 gate rule 的 target 语义与现有 capability 不重叠
        4. 不同 Engine 模块 — 涉及不同的 schema contract、CLI、或 trace event 族
      SHALL NOT 以主题标签（如 "UX 相关"、"性能相关"）作为 capability 边界——主题标签描述关注领域，不描述行为契约的约束条件。
