# Requirement ID Registry
#
# 规则:
#   1. 只增不删 — 已分配的 ID 永不复用，废弃的在描述末尾追加 [DEPRECATED]
#   2. 分配前先查 — 在此文件中搜索确认 ID 未被占用
#   3. 格式:  PREFIX-NNN: <capability-name> — <description>
#      - key 是全局唯一 ID，格式 [A-Z]{3}-\d{3}
#      - value 的 <capability-name> 用 kebab-case
#   4. 引号:  YAML 值不需要引号，除非值内包含 ": "（冒号+空格）
#      例:  AGT-001: agent-testing — simple description        （无需引号）
#           AGT-002: "agent-testing — 含 colon: 需引号包裹"     （需双引号）
#      切勿用单引号——YAML 单引号内无法转义，双引号用 \" 即可。
#   5. check-project-reqs.mjs 扫描本文件做一致性校验
#
# 三态:
#   alive   — ID 出现在 openspec/specs/ 某个 main spec 的 > req: 行
#   pending — ID 出现在 openspec/changes/<active>/specs/ 的 delta spec 中
#   retired — 本行末尾标了 [DEPRECATED]，ID 占位永不复用
#
# 缩写规则: 首单词前 2 字母 + 次单词首字母，如 schema-core → SCO

