schema_version: semantic-fact-families/v1
families:
  - id: verification.autorun-current-retained-observation
    bounded_question: >-
      Which retained Autorun report/audit records may establish current
      prediction, admission, qualification, group-selection, or launch facts,
      and which records are diagnostic-only historical material?
  - id: research.scope-and-rerun-intent
    bounded_question: What are the current scope, canonical Topic, and rerun intent?
  - id: research.host-access-envelope
    bounded_question: >-
      What does the latest bounded direct-page observation say about the fixed
      China and overseas samples — each sample's compact terminal outcome, whether
      any non-diagnostic core sample returned real content, the observation time,
      and any required direct summary reason. Current sample outcomes are a Phase semantic-input fact,
      not an Engine-owned network diagnosis.
  - id: queue.demand-lifecycle
    bounded_question: What is the legal lifecycle of queue demand, terminal history, and replacement?
  - id: work-unit.attempt-identity-and-actor
    bounded_question: Are work-unit identity, queue/assignment binding, actor, nonce, and runtime receipt consistent?
  - id: work-unit.assignment-output-obligation
    bounded_question: What direct-output declaration and required-output obligations does this work-unit assignment impose?
  - id: work-unit.wave0-source-output
    bounded_question: Has Wave0 fulfilled its source_yaml direct-output contract?
  - id: work-unit.wave1-evidence-summary-output
    bounded_question: Has Wave1 fulfilled its evidence_summary direct-output contract?
  - id: work-unit.wave1-question-list-output
    bounded_question: Has Wave1 fulfilled its question_list direct-output contract?
  - id: work-unit.source-claim-provenance
    bounded_question: Does a source claim, accepted URL, cache trail, or degraded capture have legal provenance?
  - id: work-unit.transaction-mutation-integrity
    bounded_question: >-
      Does the observed work-unit transaction lock or journal provide current
      v2 mutation authority, require a fail-closed suspect stop, or permit no
      transaction conclusion?
  - id: work-unit.submission-ledger-and-supersession
    bounded_question: What is the current-versus-historical conclusion of submit, ledger/hash, and supersession lineage?
  - id: wave.submitted-reference-convergence
    bounded_question: Are Wave0/Wave1 submitted backing, reference materialization, and convergence consistent?
  - id: wave2.finding-and-target-authority
    bounded_question: What is the authority of Wave2 findings, carried targets, synthesis, and cross-reference?
  - id: lifecycle.gate-status-trace-handoff
    bounded_question: Do Gate, status, trace, and handoff receipt constitute legal lifecycle evidence?
  - id: final.primary-report-series
    bounded_question: >-
      Given the safe direct-root Final inventory, which file is the modern or
      legacy primary base, what immutable contiguous revision series and latest
      committed report exist, what version/target may be allocated next, or
      which ambiguity or malformed-history fact blocks that conclusion?
  - id: final.submitted-backing-admission
    bounded_question: Does each Final Evidence Map link have legal submitted backing?
  - id: bundle.current-entry-contract
    bounded_question: May an explicitly selected bundle root enter a current Harness operation under the same-root BUNDLE_ENTRY.md plus BUNDLE_MAP.md contract?
  - id: cli.exit-code-convention
    bounded_question: >-
      For each documented framework CLI, which exit code does it emit for pass,
      consistency-issue, and invocation/configuration-error results per the
      accepted cli-exit-code-conventions contract, and is that behavior aligned
      with its header and COMMANDS.md inventory entry?
  - id: artifact.persistence-operation-contract
    bounded_question: >-
      Which parameters does each operate-artifact-persistence operation
      (persist / persist-final-report / publish-final-report / sweep) accept,
      and which workspace type does its recovery advice address, per the
      accepted artifact-persistence-recovery contract?
  - id: bundle.run-scoped-script-location
    bounded_question: >-
      Where do run-scoped helper scripts durably live for the current run
      bundle, and what authority status does that location carry?
  - id: lifecycle.reentry-checkpoint-targeting
    bounded_question: >-
      For a post-final rerun entry, which checkpoint target SHALL the reentry
      diagnostic (`check-reentry --at`) use, and what does each accepted target
      form (gate enum vs phase ref) mean for the current chain?
